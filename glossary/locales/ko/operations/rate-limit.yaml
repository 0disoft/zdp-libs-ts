short: "Rate Limit는 특정 시간 안에 허용된 요청 횟수를 제한하는 기법이다. 남용 방지와 안정성 유지, 공격 완화가 주된 목적이다. HTTP 429 응답과 토큰 버킷, 슬라이딩 윈도우 같은 알고리즘이 사용된다."
long: |-
  Rate Limit는 서버가 일정 시간 동안 받을 요청 수를 제한하는 기법이다. 클라이언트는 정해진 횟수 이상의 요청을 보낼 수 없다. 이 제한은 서버의 자원을 보호하는 역할을 한다. 초과된 요청은 거부되거나 지연 처리될 수 있다.

  주된 목적은 요청 남용을 방지하는 것이다. 서버 과부하를 줄여 안정성을 유지할 수 있다. 의도적인 공격의 영향을 완화할 수 있다. 이를 통해 정상 사용자의 경험도 보호된다.

  제한 상태는 HTTP 429 응답으로 전달될 수 있다. 구현에는 토큰 버킷 알고리즘이 자주 쓰인다. 슬라이딩 윈도우 알고리즘도 폭넓게 사용된다. 상황에 따라 둘을 조합해 더 정밀하게 제어할 수도 있다.
