short: "최소 수집은 서비스에 꼭 필요한 정보만 수집하고 필요성이 사라지면 삭제하는 원칙이다. 정부 요청 대응 정책만으로 개인정보를 모두 지킬 수는 없다. 필요 없는 정보는 애초에 모으지 않는 것이 가장 안전한 보호 수단이다."
long: |-
  최소 수집은 서비스 제공에 필요한 범위를 넘어서는 개인정보를 만들지 않는 원칙이다. 필요한 정보도 목적 달성 뒤에는 관계 법령상 보관 의무가 없는 한 정해진 기간에 삭제한다. 수집 항목을 줄이면 정부기관 요청이나 보안 사고로 노출될 수 있는 정보 자체가 줄어든다. 이 원칙은 기술적 보호와 함께 개인정보 보호의 출발점으로 쓰인다.

  서비스는 기능 제공에 불필요한 정보를 가능한 한 수집하지 않는다. 필요성이 사라진 정보는 보관 기간이 지나면 규칙에 따라 정리한다. 정기 점검에서 항목별 필요성을 다시 살피고 불필요한 항목은 제거한다. 이 과정에서도 법령상 보관 의무가 있는 정보는 예외로 나눠 관리한다.

  기술적으로 가능한 서비스에서는 암호화와 접근 권한 제한, 데이터 분리를 함께 적용한다. 보유하지 않는 정보나 이미 삭제된 정보는 임의로 복원해 제공하지 않는다. 복호화할 수 없도록 설계된 정보는 기술적으로 열 수 없음을 명확히 한다. 최소 수집과 기술적 보호는 함께 운영될 때 효력이 있다.
