short: "복호화는 암호화된 정보를 다시 원래 형태로 풀어 읽는 과정이다. 기술적으로 복호화할 수 없도록 설계된 정보는 회사도 임의로 열 수 없다. 보유하지 않거나 열 수 없는 정보는 정부기관 요청에도 제공하지 않는다."
long: |-
  복호화는 암호화되어 알아볼 수 없게 된 정보를 권한 있는 주체가 다시 읽을 수 있는 상태로 되돌리는 과정을 뜻한다. 정보를 보호할 때는 내용을 바로 보관하지 않고 암호화된 상태로 둔다. 정당한 권한과 필요한 도구가 있어야만 원래 내용을 확인할 수 있다. 권한이 없으면 암호화된 상태 그대로 남아 읽기 어렵다.

  회사는 기술적으로 가능한 서비스에서 암호화와 접근 권한 제한, 데이터 분리를 함께 적용한다. 보유하지 않는 정보나 이미 적법하게 삭제된 정보는 임의로 복원해 전달하지 않는다. 복호화 키를 갖지 않도록 설계된 정보는 회사도 기술적으로 열 수 없음을 분명히 한다. 이 기준은 서비스 설계 단계에서 미리 정해 운영한다.

  정부기관이나 제3자가 정보 제공을 요청해도 열 수 없는 정보까지 새로 만들어 제공하지 않는다. 보유 범위와 설계상 한계를 이유로 필요한 최소 범위만 제공한다. 이미 삭제된 정보가 존재하지 않는다는 사실 자체를 이용해 추가 요구를 정당화하지 않는다. 최소 수집과 기술적 보호는 함께 설명할 때 정책의 의미를 정확히 이해할 수 있다.
