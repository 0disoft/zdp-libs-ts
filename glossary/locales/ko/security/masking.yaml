short: "마스킹은 개인정보의 일부를 가려서 보여주는 처리 방식이다. 운영자는 기본적으로 마스킹된 정보만 볼 수 있다. 원문을 확인해야 하는 경우에만 사유와 범위를 기록하고 접근한다."
long: |-
  마스킹은 이름이나 계정 정보 같은 개인정보의 일부를 별표 등으로 가려 표시하는 방법이다. 업무를 처리하는 데 필요한 최소한의 정보만 보이도록 한다. 개인정보를 다루는 시스템에서는 마스킹이 기본 원칙으로 적용된다. 운영자와 고객 지원 인력도 기본적으로 마스킹된 정보만 본다.

  사용자 콘텐츠 원문이나 외부 계정 토큰처럼 가리면 업무가 불가능한 경우가 있다. 이런 예외 상황에는 사유, 접근 범위, 만료 시간을 기록한다. 접근 기록은 감사 로그로 남겨 추후 확인할 수 있게 한다. 예외 접근은 필요한 최소 인원에게만 허용된다.

  마스킹은 데이터를 지우는 것이 아니라 보여주는 방식을 제한하는 처리이다. 저장된 원본 정보는 필요한 보안 기준을 유지하며 보관한다. 사용자는 언제든 자신의 정보 처리 현황을 문의할 수 있다. 마스킹 기준은 개인정보 처리방침에 따라 운영된다.
