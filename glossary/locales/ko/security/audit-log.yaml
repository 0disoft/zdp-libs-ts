short: "감사 로그는 누가 언제 어떤 정보에 접근했는지 기록하는 보안 기록이다. 예외적인 접근은 사유와 범위, 만료 시간과 함께 남는다. 보안 사고가 생기면 이 기록으로 원인을 확인한다."
long: |-
  감사 로그는 시스템에서 이루어진 주요 접근과 변경을 시간순으로 남기는 기록이다. 누가 어떤 정보를 언제, 어떤 목적으로 접근했는지 확인할 수 있게 한다. 정상적인 업무 처리 기록도 포함되며 권한 범위 안에서만 이루어진다. 기록 자체는 위조나 삭제가 어렵게 보호된다.

  개인정보 원문이나 외부 계정 토큰에 접근하는 예외 상황은 반드시 감사 로그에 남는다. 접근 사유, 범위, 만료 시간이 함께 기록되어 투명성을 확보한다. 보안 사고나 부정 이용이 의심되면 이 기록으로 원인을 추적한다. 기록 열람 권한도 별도로 제한되어 운영된다.

  감사 로그는 개인정보를 안전하게 다루는 기본 장치이다. 개인정보 처리방침은 감사 로그의 운영 기준을 공개한다. 사용자 데이터를 확인하는 일은 최소한으로 유지되며 항상 기록된다. 필요 없어진 기록은 정해진 보관 기간에 따라 삭제한다.
