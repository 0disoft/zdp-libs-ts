short: "토큰은 외부 계정 연결 상태를 나타내는 접근 증표이다. 비밀번호 대신 제한된 권한만 확인할 수 있게 해준다. 연결을 해제하면 저장된 토큰은 삭제된다."
long: |-
  토큰은 사용자가 외부 서비스 연결을 허용했을 때 발급되는 접근 증표이다. 비밀번호처럼 전체 권한을 주는 대신 허용한 범위만 사용할 수 있게 한다. 외부 서비스는 이 토큰으로 사용자를 대신해 제한된 작업을 수행한다. 토큰 자체는 비밀번호가 아니며 필요할 때 다시 발급할 수 있다.

  저장된 토큰은 연결된 기능을 실행할 때만 사용한다. 토큰을 확인해야 하는 상황에는 사유와 접근 범위를 기록한다. 사용자가 연결을 해제하면 즉시 새로운 접근 권한이 중단된다. 해제 후에는 저장된 토큰과 캐시 데이터를 삭제하는 절차를 진행한다.

  개인정보 처리방침은 토큰의 수집과 보관, 삭제 기준을 투명하게 공개한다. 토큰은 일반 데이터와 분리해서 안전하게 보관한다. 보안 사고나 의심스러운 접근이 감지되면 토큰을 폐기하고 재발급할 수 있다. 사용자는 언제든 연결 목록에서 권한을 확인하고 철회할 수 있다.
