short: "휴면 상태는 일정 기간 동안 로그인이나 서비스 이용이 없는 계정 상태이다. 구매한 레몬은 휴면 상태라는 이유만으로 삭제되지 않는다. 계정을 다시 사용하면 구매 레몬의 권리는 그대로 유지된다."
long: |-
  휴면 상태는 계정이 일정 기간 동안 로그인하지 않거나 서비스를 이용하지 않아 대기 상태가 된 것을 뜻한다. 휴면 상태가 되더라도 계정 정보와 구매 레몬은 그대로 보관된다. 구매 레몬의 유효기간은 휴면 여부와 관계없이 동일하게 적용된다. 계정을 다시 로그인하면 휴면 상태는 해제된다.

  휴면 상태는 계정 폐쇄나 서비스 종료와 다르다. 계정 폐쇄나 서비스 종료 시에는 남은 레몬의 환불과 이관 절차를 미리 안내한다. 휴면 상태에서는 별도의 안내 없이 구매 레몬을 지우지 않는다. 휴면 기준 기간은 제품별 안내에서 확인할 수 있다.

  휴면 상태가 오래 지속되어도 구매 레몬의 소유권은 유지된다. 휴면 중에는 유효기간이 있는 레몬만 만료될 수 있다. 만료 여부와 일정은 잔액 화면에서 확인할 수 있다. 궁금한 사항은 고객 지원 채널을 통해 문의할 수 있다.
