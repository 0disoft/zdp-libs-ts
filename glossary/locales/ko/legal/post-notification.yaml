short: "사후 통지는 법령상 고지가 금지되거나 유예되었던 요청 사실을 법적 제한이 풀리면 나중에 알리는 절차이다. 비밀유지 명령 등으로 즉시 알릴 수 없던 경우에 쓰인다. 해제 즉시 지체 없이 이용자에게 알려 투명성을 보장한다."
long: |-
  사후 통지는 정부기관 정보 요청 사실을 법률에 따라 즉시 고지하지 못했을 때 해제 후 알리는 절차를 뜻한다. 수사 기밀 보호 등을 이유로 법령상 통지가 금지되거나 유예될 수 있다. 해당 기간에는 요청기관, 요청의 성격, 요구된 정보 범위 같은 내용을 바로 안내하기 어렵다. 법률이 허용하는 즉시 고지가 원칙이지만 예외적인 유예가 인정될 수 있다.

  해당 법적 제한이 해제되면 회사는 지체 없이 이용자에게 알리는 것을 원칙으로 한다. 유예 기간에 제공할 수 없던 요청 관련 정보를 함께 보충한다. 실제 제공한 정보 범위가 요청 범위보다 좁으면 그 한정 사실도 분명히 한다. 통지와 함께 이의제기 같은 후속 절차가 남아 있는지도 안내한다.

  통지가 금지된 사실 자체를 무기로 추가 정보를 요구하는 관행은 허용하지 않는다. 하나의 비밀유지 명령이 다른 사건의 통지까지 미루는 근거가 되지 않도록 관리한다. 비밀유지 명령의 범위는 사건별로 따로 따지고 해제 시점을 확인해 알린다. 관련 운영 기준은 이용자 통지 및 투명성 관련 정책에서 정한다.
