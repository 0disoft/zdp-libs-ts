short: "관할은 특정 기관이나 법원이 사건을 다루는 정당한 권한과 범위를 뜻한다. 정부기관의 정보 요청 심사에서 권한과 관할의 적법성을 따진다. 분쟁 해결에서는 관련 법령에 따른 관할 법원이 최종 판단을 맡는다."
long: |-
  관할은 어떤 행정기관이나 수사기관, 법원이 특정 사건을 맡을 정당한 영역을 뜻한다. 기관의 권한과 국가·지역별 적용 범위, 단계별 절차 권한을 함께 가리킨다. 정보 제공 요청이 들어오면 요청기관이 해당 사건을 다룰 권한이 있는지부터 살핀다. 관할이 없거나 불명확하면 요청의 적법성 자체를 다시 따진다.

  정부 요청 심사에서는 요청기관의 권한과 관할, 절차의 적법성, 대상의 특정성, 관련성을 함께 검토한다. 관할이 확인되지 않는 요청은 형식 요건부터 갖추도록 보완을 요구한다. 필요한 경우에는 정규 권한을 가진 기관을 통해서만 다시 요청하도록 안내한다. 이 과정에서 요청 범위를 함께 축소하도록 요구할 수 있다.

  분쟁 해결에서도 관할은 중요한 기준이다. 약관상 분쟁은 관련 법령에 따른 관할 법원의 판단을 따른다. 어느 법원이 맞는지 다투는 절차 조건도 관련 절차에서 정한다. 이용자는 분쟁이 생기면 고객 지원 채널로 먼저 해결을 시도한 뒤 필요하면 관할 절차로 진행한다.
