short: "사법 절차는 법원이 적법한 권한과 절차에 따라 분쟁을 판단하고 결정을 내리는 과정을 뜻한다. 한 국가의 정치 체제만으로 모든 사법 절차를 일률적으로 평가하지 않는다. 각 요청에 적용되는 구체적인 절차와 사정을 기준으로 판단한다."
long: |-
  사법 절차는 적용되는 법률에 따라 권한을 가진 법원이 분쟁을 심리해 결정을 내리는 과정을 뜻한다. 관할 판단과 심리, 증거 심사, 결정 집행까지의 절차가 함께 포함된다. 한 국가 안에서도 사건 종류와 단계에 따라 담당 법원과 절차가 달라질 수 있다. 정치적 성격의 사건도 사법 절차에서는 법률 요건과 증거를 따로 따져 판단한다.

  회사는 특정 국가의 정치 체제나 특정 공직자의 존재, 법관의 임명 방식 같은 단일 요소만으로 사법 절차 전체를 일괄 판단하지 않는다. 각각의 요청에 적용되는 법적 절차와 구체적인 사정을 개별적으로 따진다. 국제형사사법 공조 절차가 함께 적용되는지도 별도로 살핀다. 정치적 박해 우려가 있는지 판단할 때도 같은 개별 심사 기준을 유지한다.

  사법 절차가 적법하게 진행되어 효력 있는 법적 명령이 확인되면 제공 범위를 다시 따진다. 근거가 불분명한 요청에는 원칙적으로 응하지 않고 절차 보완을 요구한다. 제공이 필요한 경우에도 집행에 필요한 최소 범위로 한정한다. 남은 판단 기준은 정치적 박해 및 외국 정부기관 요청 관련 정책에서 함께 정한다.
