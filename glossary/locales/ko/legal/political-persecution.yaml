short: "정치적 박해는 정치적 견해나 신분 등을 이유로 처벌이나 보복 등 불리한 처분을 받을 위험을 뜻한다. 정부가 비판 세력이나 언론·시민 활동을 추적하거나 억압하는 목적과 연결된다. 회사는 이런 목적의 정보 요청이라고 판단하면 법률이 허용하는 범위에서 제공을 거부하고 이의를 제기한다."
long: |-
  정치적 박해는 특정 정치적 견해나 사회적 신분, 활동 이력을 이유로 처벌과 보복, 형사상 불이익을 받을 위험을 뜻한다. 정부 비판이나 언론·연구·창작·시민 활동 같은 적법한 표현이 억압 대상이 될 때 이를 가리킨다. 이용자가 해당 위험에 놓였다고 판단할 합리적인 근거가 있으면 독립적인 평가가 필요하다. 평가 결과에 따라 정보 제공 여부를 다시 판단한다.

  회사는 이용자의 합법적인 표현을 추적하거나 억압하려는 목적의 요청에는 응하지 않는 것을 원칙으로 한다. 정치적 박해나 표현 억압이 목적이라고 볼 합리적인 근거가 있는 정보 요청은 법률이 허용하는 범위에서 거부한다. 부당한 요구에는 이의를 제기하고 범위를 축소하도록 요구한다. 축소된 범위 안에서도 이용자 권리를 지키기 위한 보호 조치를 취한다.

  특정 국가의 정치 체제나 특정 공직자의 존재 여부만으로 모든 사법 절차를 일률적으로 평가하지 않는다. 각 요청에 적용되는 법적 절차와 구체적인 사정을 따로 판단한다. 정치적 박해 우려가 있는 사건은 더 엄격한 기준으로 검토한다. 판단 결과는 투명하게 안내하고 필요한 보호 조치를 유지한다.
