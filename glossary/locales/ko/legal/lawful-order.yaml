short: "법적 명령은 법원이 적법한 절차에 따라 내린 효력 있는 결정이나 명령을 뜻한다. 공공기관의 요구라도 이런 절차를 거치지 않으면 법적 명령이 아니다. 법령상 제공 의무가 인정될 때 회사는 최소한의 정보만 제공한다."
long: |-
  법적 명령은 적용되는 법률에 따라 권한 있는 법원이 정당한 절차를 거쳐 내린 결정이나 명령을 뜻한다. 영장이나 판결 같은 집행력이 있는 명령이 이에 해당한다. 공공기관의 요구라도 법원의 심사 없이 내부 결정으로만 이루어지면 법적 명령에 해당하지 않는다. 어떤 것이 법적 명령인지 판단할 때는 관할과 절차의 적법성을 함께 본다.

  회사는 정보 요청이 들어오면 해당 요구가 법률상 의무가 되는지, 적법한 근거가 확인되는지 따진다. 의무가 없거나 근거가 불분명한 요청에는 원칙적으로 응하지 않는다. 의무가 있다고 해도 집행에 필요한 최소한의 정보만 제공한다. 요구 범위를 넘어서는 정보까지 임의로 추가해 제공하지 않는다.

  정치적 박해나 표현 억압과 연결된 요청이라도 적법한 법적 명령이 확인되면 법률 판단에 따라 다르게 다룰 수 있다. 그 경우에도 범위 축소나 이의제기 등 법률이 허용하는 보호 조치를 검토한다. 예외로 인정되는 생명·신체 관련 긴급 사유도 법령이 정한 요건과 최소 범위를 먼저 따진다. 관련 절차는 정부기관 요청 관련 정책과 약관에서 함께 정한다.
