short: "국제형사사법 공조는 국가 간 수사나 법 집행을 돕기 위해 정해진 법적 절차로 협력하는 제도이다. 외국 정부기관이 직접 요구해도 대한민국에서 효력이 인정되는 절차를 거쳤는지 확인한다. 적법한 근거가 없는 요청에는 원칙적으로 응하지 않는다."
long: |-
  국제형사사법 공조는 범죄 수사와 형사 재판을 위해 국가 간에 정보를 제공하고 협력하는 절차이다. 외국 수사기관이나 법원이 요청을 보내더라도 대한민국 법질서에서 인정되는 경로를 통과해야 효력이 생긴다. 조약이나 국내 법률에서 정한 공조 절차가 이에 해당한다. 이 절차를 거쳤는지 확인하는 것이 외국 요청 심사의 출발점이다.

  회사는 외국 정부기관이 직접 정보를 요구하면 관련 법률과 공조 절차의 충족 여부를 살핀다. 대한민국에서 효력이 인정되는 적법한 절차 없이 들어온 요청에는 원칙적으로 응하지 않는다. 필요한 경우에는 정규 공조 통로를 거쳐 다시 요청하도록 안내한다. 긴급한 생명·신체 위험 등 법률이 허용하는 최소한의 예외만 따로 검토한다.

  특히 정치적 견해나 합법적인 표현을 추적·처벌하려는 요청이라고 볼 근거가 있으면 더 엄격하게 판단한다. 법률이 허용하는 범위에서 이의를 제기하고 정보 제공 범위를 최소화한다. 이 단계에서도 최소 수집 원칙과 기술적 보호 장치를 유지한다. 남은 판단 기준은 외국 정부기관 요청 관련 정책에서 정한다.
