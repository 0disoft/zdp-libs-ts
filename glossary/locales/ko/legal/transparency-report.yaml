short: "투명성 보고서는 정부기관의 정보 요청 건수와 실제 제공·거부 건수 등을 모아 공개하는 보고서이다. 서비스 규모와 요청 건수가 늘어날 때 공개한다. 이용자는 전체 요청 동향을 한눈에 확인할 수 있다."
long: |-
  투명성 보고서는 정부기관, 수사기관 등으로부터 들어온 이용자 정보 요청 현황을 집계해 외부에 공개하는 보고서이다. 요청 건수, 실제 제공 건수, 전부 또는 일부를 거부한 건수 같은 수치가 포함된다. 분기나 연간 단위로 집계해 정기적으로 갱신한다. 보고서는 특정 사건의 내용 대신 전체적인 추세를 보여준다.

  보고서는 이용자 통지와 함께 투명성을 높이는 장치로 쓰인다. 법률에 따라 즉시 알릴 수 없는 경우에도 사후 통지와 별도로 통계를 공개한다. 통계는 개인을 식별할 수 없도록 집계해 제공한다. 이용자는 보고서로 정부 요청 대응의 규모와 원칙을 확인할 수 있다.

  회사는 서비스 규모가 커지고 요청 규모가 유의미해지면 보고서를 공개하는 것을 원칙으로 한다. 공개 시점과 범위는 법률 자문과 운영 여건을 고려해 정한다. 필요하면 독립적인 검증 절차를 거친 뒤 공개한다. 투명성 보고서 운영 기준은 개인정보 처리방침과 약관의 해당 장에서 알린다.
