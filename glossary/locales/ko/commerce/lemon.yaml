short: "Lemon은 여러 제품에서 공통으로 사용하는 통합 크레딧 단위이다. 구매 시 지급되는 유상 레몬과 보너스로 지급되는 무상 레몬으로 구분된다. 유상 레몬은 환불 대상이 될 수 있다."
long: |-
  Lemon은 여러 제품에서 공통으로 사용하는 크레딧 단위이다. 구매를 통해 지급되는 유상 레몬과 이벤트나 보상으로 지급되는 무상 레몬으로 나뉜다. 각 레몬의 유효기간과 환불 가능 여부는 지급 시점에 정해진 조건을 따른다. 잔액 화면에서는 레몬의 출처와 만료일을 확인할 수 있다.

  레몬은 서비스 이용 시 필요한 단위로 차감된다. 실제 차감은 작업이 완료된 범위만큼만 이루어진다. 작업이 시작되지 않았거나 회사 귀책으로 유효한 결과를 받지 못한 경우에는 예약된 레몬이 복원된다. 차감 내역은 결제 및 이용 기록에서 확인할 수 있다.

  보너스 레몬은 유상 레몬과 사용 순서가 다르게 적용될 수 있다. 보너스 레몬은 유효기간이 짧은 것부터 먼저 사용된다. 유효기간이 지난 레몬은 자동으로 소멸되며 복구되지 않는다. 전체적으로 레몬의 지급과 만료, 복구 규칙은 크레딧 정책에서 정한 기준을 따른다.
