short: "원 결제수단은 결제 당시 사용자가 실제로 사용한 지불 수단이다. 환불은 원칙적으로 이 원 결제수단으로 돌아간다. 결제수단 사업자의 사정에 따라 반영 시기가 달라질 수 있다."
long: |-
  원 결제수단은 결제를 진행할 때 사용자가 실제로 지불한 카드나 계좌 등의 수단을 뜻한다. 환불 신청이 확정되면 남은 금액은 원칙적으로 이 수단으로 돌려준다. 카드사 등 결제수단 사업자의 처리 일정에 따라 실제 반영까지 추가 기간이 걸릴 수 있다. 반영 상태는 결제 및 이용 기록에서 확인할 수 있다.

  부분 환불이 원 결제수단 구조상 불가능한 경우 대안을 안내한다. 대안이 되는 환불 방법과 최종 금액은 신청 확정 전에 미리 알려준다. 사용자가 동의한 뒤에만 대체 환불이 진행된다. 동의하지 않으면 기존 원 결제수단 기준을 유지한다.

  환불 금액과 수단은 신청 과정에서 투명하게 표시된다. 회수되는 보너스 레몬이나 혜택도 같은 화면에서 함께 안내한다. 최종 정산 내역은 확정 전에 다시 한번 공개한다. 관련 기준은 환불 정책과 크레딧 정책에서 확인할 수 있다.
