short: "환급은 서비스 이행이 계약과 다르거나 중복 결제가 확인될 때 대금을 돌려주는 처리이다. 유상 레몬은 사용 분량을 제외하고 정산된다. 남은 금액은 환불 정책에 따라 돌려받는다."
long: |-
  환급은 결제 시점에 안내된 계약과 실제 제공된 내용이 다를 때 대금을 돌려주는 처리이다. 중복 결제나 시스템 오류로 인한 잘못된 결제도 환급 대상이 된다. 결제 시점의 계약과 실제 지급된 레몬·혜택을 비교해 환급 사유를 판단한다. 환급 사유가 인정되는지와 필요한 증빙은 환불 정책에서 구체적으로 정한다.

  환급이 인정되면 해당 결제로 지급된 유상 레몬과 보너스 혜택은 회수 대상이 된다. 이미 일부 레몬을 사용한 경우에는 사용 분량을 제외하고 정산한다. 보너스 레몬은 유효기간과 지급 조건에 따라 별도로 처리될 수 있다. 최종 정산 내역과 환불 금액은 신청 확정 전에 미리 확인할 수 있다.

  중복 결제나 회사 귀책으로 유효한 결과를 제공하지 못한 경우 예약된 레몬은 복원되거나 전액 환급된다. 처리 기한과 반환 방법은 결제 수단과 관계 법령에 따른다. 전체적인 환급 절차는 이용약관, 크레딧 정책, 환불 정책이 함께 정한다. 환급 상태는 결제 및 이용 기록에서 확인할 수 있다.
