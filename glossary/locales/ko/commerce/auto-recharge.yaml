short: "자동 충전은 레몬 잔액이 기준 이하로 내려가면 설정한 금액만큼 자동으로 충전하는 기능이다. 이용자는 언제든 자동 충전을 해지할 수 있다. 해지 이후에는 추가 충전이 발생하지 않는다."
long: |-
  자동 충전은 사용자가 직접 충전하지 않아도 잔액을 유지할 수 있게 하는 기능이다. 잔액이 정해진 기준보다 낮아지면 설정한 금액으로 자동 충전이 진행된다. 충전 내역과 금액은 결제 기록에서 확인할 수 있다. 자동 충전을 이용할지 여부는 사용자가 직접 선택한다.

  자동 충전 해지는 언제든 가능하며 해지 시점 이후의 추가 충전만 중단된다. 해지 전에 이미 완료된 결제 건은 기존 환불 기준을 그대로 따른다. 자동 충전으로 결제된 금액도 일반 결제와 동일하게 환불 대상이 될 수 있다. 해지 후에는 필요한 만큼 직접 충전하면 된다.

  자동 충전 설정 화면에서 기준 잔액과 충전 금액을 정할 수 있다. 설정 변경과 해지 내역은 서비스 화면에서 확인할 수 있다. 자동 충전으로 인한 오류는 고객 지원 채널을 통해 정정할 수 있다. 전체 기준은 크레딧 정책과 환불 정책이 함께 정한다.
