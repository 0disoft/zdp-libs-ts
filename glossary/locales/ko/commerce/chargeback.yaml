short: "차지백은 결제 분쟁이 생겼을 때 결제 대행사를 통해 대금이 되돌아가는 절차이다. 중복 결제나 오류가 아닌 사유로 대금이 회수되면 관련 혜택도 함께 정리된다. 문제 해결 전까지 해당 결제와 유료 기능 이용이 제한될 수 있다."
long: |-
  차지백은 카드사나 결제 대행사가 분쟁을 이유로 결제 대금을 회수하는 절차이다. 결제자가 승인하지 않은 결제라고 주장하거나 서비스 분쟁이 생긴 경우 시작될 수 있다. 회사는 차지백 사유를 확인하고 필요한 증빙을 제출해 대응한다. 차지백 결과는 결제 상태와 거래 내역에 반영된다.

  차지백으로 대금이 회수되면 그 결제로 지급된 구매 레몬과 보너스 레몬은 회수 대상이 된다. 이미 사용한 레몬이 있다면 사용분만큼 정산이 이루어진다. 문제가 해결되기 전에는 결제 및 해당 유료 기능 이용이 제한될 수 있다. 제한 사유와 진행 상태는 사용자에게 명확히 안내한다.

  차지백은 일반 환불과 절차가 다르다. 환불은 서비스가 먼저 처리하는 반면 차지백은 결제 대행사가 개입한다. 이의가 받아들여지지 않으면 대금은 유지되고 차감 내역도 그대로 유지된다. 자세한 기준은 환불 정책과 크레딧 정책에서 확인할 수 있다.
