short: "CDN은 전 세계 여러 서버에 파일을 나눠 보관하고 가까운 서버에서 빠르게 전달하는 네트워크이다. 사이트의 글꼴이나 스크립트 같은 공용 파일을 안정적으로 제공하는 데 쓰인다. 요청 과정에서 접속 IP 주소가 CDN 사업자에게 전달될 수 있다."
long: |-
  CDN은 Content Delivery Network의 줄임말로, 파일을 여러 지역의 서버에 복사해 두고 사용자와 가까운 서버에서 내려주는 방식이다. 글꼴, 스크립트, 이미지 같은 공용 파일을 빠르고 안정적으로 전달하기 위해 사용한다. 특정 서버 하나에 부하가 몰리는 대신 지역별 서버가 요청을 나눠 처리한다. 사용자가 느끼는 페이지 로딩 속도도 함께 개선된다.

  현재 사이트는 글꼴 전달을 위해 jsDelivr CDN을 사용한다. 사용자가 페이지를 열면 CDN 서버에 파일을 요청하는 과정이 생긴다. 이 과정에서 접속 IP 주소와 브라우저 기본 정보가 CDN 사업자에게 전달될 수 있다. 전달되는 정보는 파일을 내려주는 데 필요한 최소한의 범위이다.

  개인정보 처리방침은 CDN 이용 사실과 처리되는 정보를 투명하게 공개한다. CDN 사업자의 하위 처리자 안내에서도 상세 현황을 확인할 수 있다. CDN은 콘텐츠를 저장하거나 분석하는 도구가 아니라 전달 경로를 빠르게 만드는 인프라이다. 서비스가 커지면 추가 CDN이나 호스팅 업체가 생길 수 있으며 사전에 안내한다.
