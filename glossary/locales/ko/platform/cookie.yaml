short: "쿠키는 사이트가 브라우저에 저장하는 작은 정보 파일이다. 언어, 테마, 글자 크기 같은 화면 설정을 기억하는 데 쓰인다. 필수 쿠키는 서비스 제공에 필요하고 선택 쿠키는 거부할 수 있다."
long: |-
  쿠키는 사용자가 방문한 사이트가 브라우저에 남기는 작은 정보 파일이다. 화면 설정값을 기억해서 다음 방문 때 같은 환경을 보여주는 데 쓰인다. 개인을 식별하는 신분증이 아니라 브라우저 안의 선택값 기록이다. 설정은 언제든 브라우저에서 확인하고 지울 수 있다.

  필수 쿠키는 서비스가 정상 작동하는 데 필요한 최소한의 기능을 담당한다. 선택 쿠키는 광고나 분석처럼 부가 기능에 쓰일 수 있다. 선택 쿠키는 동의 관리 기능이나 브라우저 설정에서 거부할 수 있다. 거부하더라도 기본 서비스 이용에는 제한이 없다.

  개인정보 처리방침은 어떤 쿠키를 어떤 목적으로 쓰는지 투명하게 공개한다. 제3자 도구가 쿠키를 사용하면 해당 사업자와 목적을 함께 안내한다. 사용자는 방문 후에도 언제든 쿠키 설정을 바꿀 수 있다. 브라우저에서 쿠키를 모두 지워도 계정 자체는 유지된다.
