short: "Vault là hệ thống mã hóa và quản lý các giá trị bí mật. Nó bao gồm các khả năng như ghi lại truy cập, hết hạn, nhật ký kiểm tra và tạo bí mật động. Nó bảo vệ an toàn các khóa API, mật khẩu cơ sở dữ liệu, chứng chỉ và token."
long: |-
  Vault là hệ thống lưu trữ và quản lý các giá trị bí mật một cách an toàn. Các giá trị bí mật bao gồm khóa API, mật khẩu cơ sở dữ liệu, chứng chỉ và token. Mã hóa được áp dụng khi lưu trữ để ngăn rò rỉ ra bên ngoài. Hệ thống ghi lại ai đã truy cập vào đâu và khi nào.

  Quyền truy cập có thể được kiểm soát chi tiết. Một số giá trị bí mật sẽ tự động hết hạn sau một khoảng thời gian nhất định. Tính năng hết hạn giúp giảm thiểu tác động của giá trị bí mật bị lộ. Lịch sử truy cập có thể được truy vết thông qua nhật ký kiểm tra.

  Các giá trị bí mật cũng có thể được tạo ra một cách động. Phương pháp này tạo ra các giá trị bí mật tạm thời có thời gian tồn tại ngắn. Các giá trị bí mật tạm thời có nguy cơ rò rỉ lâu dài thấp hơn. Nhìn chung, nó làm tăng tính ổn định và linh hoạt của việc quản lý giá trị bí mật.
