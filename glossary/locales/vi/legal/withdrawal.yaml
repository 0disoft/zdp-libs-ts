short: "Rút lại là chế độ cho phép rút lại hợp đồng trong một khoảng thời gian nhất định sau khi ký kết. Trong dịch vụ, rút lại trở thành căn cứ khi điều kiện cấp Lemon trả phí được thực hiện khác với hợp đồng. Thời hạn và quy trình cụ thể tuân theo tiêu chí được quy định trong chính sách hoàn tiền."
long: |-
  Rút lại là quyền của người tiêu dùng để làm cho hợp đồng không còn hiệu lực trong một khoảng thời gian nhất định sau khi ký kết. Nó được sử dụng làm tiêu chí đánh giá khi nội dung hiển thị, quảng cáo hoặc hợp đồng khác với những gì thực tế được cung cấp. Nếu yêu cầu được gửi trong thời hạn do pháp luật và điều khoản quy định, hiệu lực của nó được công nhận. Khi rút lại được công nhận, số tiền của hợp đồng đó được hoàn trả.

  Trong dịch vụ, rút lại trở thành vấn đề khi việc cấp Lemon hoặc cung cấp dịch vụ khác với nội dung hợp đồng. Thanh toán trùng lặp hoặc cấp sai do lỗi của công ty cũng thuộc đối tượng hiệu chỉnh. Việc lý do rút lại có được công nhận hay không được đánh giá bằng cách so sánh hợp đồng tại thời điểm thanh toán với việc thực hiện thực tế. Tiêu chí đánh giá và bằng chứng cần thiết được thông báo cụ thể trong chính sách hoàn tiền.

  Khi rút lại được công nhận, Lemon và lợi ích được cấp bởi khoản thanh toán đó trở thành đối tượng thu hồi. Nếu có Lemon đã sử dụng, phần đã sử dụng được loại trừ khỏi thanh toán. Số tiền hoàn lại cuối cùng và chi tiết thu hồi có thể được kiểm tra trước khi xác nhận yêu cầu. Toàn bộ quy trình rút lại và thời hạn xử lý do pháp luật liên quan, điều khoản và chính sách hoàn tiền cùng quy định.
