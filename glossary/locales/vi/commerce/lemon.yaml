short: "Lemon là đơn vị tín dụng tích hợp được sử dụng chung trên nhiều sản phẩm. Lemon được chia thành Lemon trả phí cấp khi mua và Lemon miễn phí cấp như phần thưởng. Lemon trả phí có thể thuộc đối tượng hoàn tiền."
long: |-
  Lemon là đơn vị tín dụng được sử dụng chung trên nhiều sản phẩm. Lemon được chia thành Lemon trả phí cấp qua việc mua và Lemon miễn phí cấp qua sự kiện hoặc phần thưởng. Mỗi Lemon tuân theo điều kiện thời hạn hiệu lực và khả năng hoàn tiền được xác định tại thời điểm cấp. Trên màn hình số dư, có thể kiểm tra nguồn gốc và ngày hết hạn của từng Lemon.

  Lemon được trừ như đơn vị cần thiết để sử dụng dịch vụ. Việc trừ thực tế chỉ áp dụng cho phạm vi công việc đã hoàn thành. Nếu công việc chưa bắt đầu hoặc không nhận được kết quả hợp lệ do lỗi của công ty, Lemon đã đặt trước sẽ được khôi phục. Lịch sử trừ có thể được kiểm tra trong hồ sơ thanh toán và sử dụng.

  Lemon thưởng có thể có thứ tự sử dụng khác với Lemon trả phí. Lemon thưởng được sử dụng trước bắt đầu từ loại có thời hạn ngắn nhất. Lemon hết hạn bị xóa tự động và không được khôi phục. Nhìn chung, các quy tắc cấp, hết hạn và khôi phục Lemon tuân theo tiêu chí được quy định trong chính sách tín dụng.
