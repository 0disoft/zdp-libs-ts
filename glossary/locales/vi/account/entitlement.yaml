short: "Quyền sử dụng là sự cho phép của tài khoản để sử dụng sản phẩm cụ thể hoặc tính năng trả phí. Chỉ tạo tài khoản không tự động cấp mọi quyền. Quyền thực tế khác nhau tùy theo độ tuổi, quốc gia cư trú, phương thức thanh toán và điều kiện sản phẩm."
long: |-
  Quyền sử dụng là quyền được áp dụng khác nhau cho từng dịch vụ ngay cả khi một tài khoản đăng nhập vào nhiều sản phẩm. Việc tạo tài khoản không tạo ra quyền đối với mọi sản phẩm hoặc tính năng trả phí. Quyền thực tế được xác định theo chính sách và trạng thái cung cấp của từng sản phẩm. Có hay không có quyền có thể được kiểm tra trên màn hình từng sản phẩm sau khi đăng nhập.

  Quyền sử dụng được quản lý cùng với trạng thái tài khoản và phương thức đăng nhập. Duy trì thông tin tài khoản cập nhật giúp việc đánh giá quyền chính xác. Việc cho mượn hoặc bán tài khoản hoặc phương thức đăng nhập cho người khác không được phép. Cố gắng sử dụng tính năng mà không có quyền cần thiết có thể dẫn đến hạn chế truy cập.

  Một số quyền bị hạn chế thêm bởi độ tuổi, quốc gia cư trú, phương thức thanh toán hoặc đặc điểm sản phẩm. Quyền bị hạn chế có thể được cấp lại khi đáp ứng điều kiện. Việc có đáp ứng điều kiện hay không được đánh giá theo tiêu chí thông báo trên màn hình dịch vụ. Tiêu chí chung về cấp và hạn chế quyền được quy định bởi điều khoản dịch vụ và hướng dẫn từng sản phẩm.
