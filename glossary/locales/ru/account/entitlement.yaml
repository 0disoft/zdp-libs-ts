short: "Право использования — это разрешение аккаунта использовать конкретный продукт или платную функцию. Только создание аккаунта не дает автоматически всех прав. Фактические права различаются в зависимости от возраста, страны проживания, способа оплаты и условий продукта."
long: |-
  Право использования — это разрешение, которое применяется по-разному к каждому сервису, даже когда один аккаунт входит в несколько продуктов. Сам факт создания аккаунта не создает прав на все продукты или платные функции. Фактические права определяются политикой и доступностью каждого продукта. Наличие права можно проверить на экране каждого продукта после входа.

  Право использования управляется вместе со статусом аккаунта и способом входа. Поддержание актуальности информации аккаунта обеспечивает точное определение прав. Передача или продажа аккаунта или способа входа другим лицам не допускается. Попытка использовать функцию без необходимого права может привести к ограничению доступа.

  Некоторые права дополнительно ограничены возрастом, страной проживания, способом оплаты или характеристиками продукта. Ограниченное право может быть снова предоставлено при выполнении условий. Выполнение условий определяется по критериям, указанным на экране сервиса. Общие критерии предоставления и ограничения прав устанавливаются условиями сервиса и руководством каждого продукта.
