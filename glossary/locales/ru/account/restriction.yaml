short: "Ограничение — это мера, которая блокирует использование сервиса при нарушении условий или наличии риска безопасности. Сфера может варьироваться от ограничения отдельных функций до ограничения всего аккаунта. Срочный риск безопасности или юридический риск может стать основанием для немедленного ограничения."
long: |-
  Ограничение — это мера, которая ограничивает использование сервиса при подтверждении нарушения условий или риска мошенничества в сфере безопасности и платежей. В зависимости от степени и сферы нарушения могут ограничиваться только некоторые функции. В более серьезных случаях может быть ограничен весь аккаунт. Причина и сфера ограничения сообщаются до или в момент применения.

  Если нет срочных оснований безопасности или юридических оснований, причина ограничения сообщается заранее и предоставляется возможность обжалования. Даже если аккаунт ограничен, пути проверки причины и истории платежей сохраняются. Обжалование может быть подано через канал поддержки клиентов в установленный срок. Снятие ограничения решается по результатам повторного рассмотрения и состоянию платежа.

  Ограничение аккаунта отличается от расторжения договора. Временное ограничение может быть снято после устранения условий. Расторжение договора ведет к закрытию аккаунта или прекращению сервиса. Оставшиеся оплаченные Lemons и платные права урегулируются или возвращаются согласно закону и политикам и не списываются массово без уведомления.
