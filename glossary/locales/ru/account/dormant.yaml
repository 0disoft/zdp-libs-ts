short: "Неактивный статус — это состояние аккаунта без входа и использования сервиса в течение определенного периода. Купленные лемоны не удаляются только из-за неактивного статуса. При повторном использовании аккаунта права на купленные лемоны сохраняются."
long: |-
  Неактивный статус означает, что аккаунт перешел в ожидание из-за отсутствия входа или использования сервиса в течение периода. Даже в неактивном статусе данные аккаунта и купленные лемоны сохраняются. Срок действия купленных лемонов применяется одинаково независимо от неактивности. Повторный вход снимает неактивный статус.

  Неактивный статус отличается от закрытия аккаунта или прекращения сервиса. При закрытии или прекращении заранее сообщается о шагах возврата и переноса оставшихся лемонов. Сама неактивность никогда не удаляет купленные лемоны без уведомления. Точный период неактивности указан в руководстве по каждому продукту.

  Право собственности на купленные лемоны сохраняется даже после долгой неактивности. Во время неактивности могут истечь только лемоны со сроком действия. Статус и даты истечения видны на экране баланса. Вопросы можно задать через канал поддержки.
