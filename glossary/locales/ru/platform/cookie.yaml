short: "Cookie — это небольшой файл, который сайт сохраняет в вашем браузере. Он запоминает настройки отображения, такие как язык, тема и размер шрифта. Обязательные cookie поддерживают сервис, а необязательные можно отклонить."
long: |-
  Cookie — это небольшой информационный файл, который посещаемый сайт оставляет в вашем браузере. Он запоминает настройки отображения, чтобы при следующем визите показывать ту же среду. Это запись выбора внутри браузера, а не документ, удостоверяющий личность. Вы можете просмотреть и удалить эти настройки в браузере в любое время.

  Обязательные cookie обеспечивают минимальные функции, необходимые для корректной работы сервиса. Необязательные cookie могут использоваться для дополнительных возможностей, таких как реклама или аналитика. Необязательные cookie можно отклонить через управление согласием или настройки браузера. Отказ не ограничивает базовое использование сервиса.

  Политика конфиденциальности прозрачно раскрывает, какие cookie используются и для каких целей. Когда сторонние инструменты используют cookie, поставщик и цель указываются вместе. Вы можете изменить настройки cookie в любое время после посещения. Удаление всех cookie в браузере не удаляет сам аккаунт.
