short: "CDN — это сеть, которая хранит файлы на многих серверах и быстро доставляет их из ближайшего расположения. Она обеспечивает общие файлы сайта, такие как шрифты и скрипты. При запросах IP-адрес доступа может передаваться поставщику CDN."
long: |-
  CDN означает Content Delivery Network и работает так: файлы копируются на серверы в нескольких регионах и доставляются с сервера, ближайшего к вам. Это используется для быстрой и надежной доставки общих файлов, таких как шрифты, скрипты и изображения. Запросы распределяются между региональными серверами, а не перегружают один сервер. Воспринимаемая скорость загрузки страницы также улучшается.

  Этот сайт использует jsDelivr CDN для доставки шрифтов. Открытие страницы создает запрос к серверу CDN за файлами. Запрос может передавать ваш IP-адрес доступа и основную информацию о браузере поставщику CDN. Передаваемая информация — это минимум, необходимый для доставки файлов.

  Политика конфиденциальности прозрачно раскрывает использование CDN и обрабатываемую информацию. Подробности также доступны в уведомлении о субподрядчиках поставщика. CDN — это инфраструктура, ускоряющая пути доставки, а не инструмент хранения или анализа контента. По мере роста сервиса могут добавляться другие CDN или хостинг-провайдеры с предварительным уведомлением.
