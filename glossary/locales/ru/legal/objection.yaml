short: "Обжалование — это процедура оспаривания оснований ограничения и запроса повторного рассмотрения. После уведомления о причине ограничения обжалование может быть подано через канал поддержки клиентов. По результатам рассмотрения причины и доказательств решается, сохранить или снять меру."
long: |-
  Обжалование — это процедура оспаривания причины ограничения или платежной меры и запроса нового решения. После уведомления о причине и основании ограничения обжалование может быть подано в установленный срок. Поданное обжалование сохраняется как запись. Решение о сохранении или снятии меры зависит от результатов рассмотрения.

  Даже при подаче обжалования пути проверки причины и истории платежей сохраняются. Если нет срочных оснований безопасности или юридических оснований, причина сообщается до ограничения. В процессе обжалования могут быть запрошены проверка личности и необходимые доказательства. Объем запроса определяется в пределах, разрешенных законом и соображениями безопасности.

  Если обжалование принято, ограничение может быть снято или смягчено. Если не принято, существующая мера сохраняется. Результат сообщается через экран сервиса, уведомление или электронную почту. Общая процедура и сроки обработки определяются совместно условиями сервиса, руководством по поддержке клиентов и применимым законодательством.
