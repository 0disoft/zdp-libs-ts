short: "Отказ от договора — это институт, позволяющий отказаться от договора в течение определенного срока после его заключения. В сервисе он служит основанием, когда условия выдачи оплаченных Lemons исполнены иначе, чем по договору. Конкретные срок и процедура следуют критериям, установленным в политике возвратов."
long: |-
  Отказ от договора — это право потребителя сделать договор недействительным в течение определенного срока после его заключения. Он используется как критерий оценки, когда содержание показа, рекламы или договора отличается от фактически предоставленного. Если запрос подан в срок, установленный законом и условиями, его действие признается. При признании отказа сумма по этому договору возвращается.

  В сервисе отказ от договора возникает, когда выдача Lemons или предоставление сервиса отличается от содержания договора. Повторные платежи или ошибочные выдачи по вине компании также подлежат исправлению. Признание причины отказа оценивается путем сравнения договора на момент платежа с фактическим исполнением. Критерии оценки и необходимые доказательства подробно описываются в политике возвратов.

  При признании отказа выданные этим платежом Lemons и преимущества подлежат отзыву. Если использованные Lemons уже есть, использованная часть исключается из урегулирования. Итоговая сумма возврата и детали отзыва могут быть проверены до подтверждения запроса. Общая процедура отказа и сроки обработки определяются совместно применимым законодательством, условиями и политикой возвратов.
