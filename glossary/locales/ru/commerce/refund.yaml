short: "Возврат — это процедура возврата денежных средств, когда исполнение сервиса отличается от договора или подтвержден повторный платеж. Оплаченные Lemons урегулируются за вычетом использованной части. Оставшаяся сумма возвращается согласно политике возвратов."
long: |-
  Возврат — это процедура возврата денежных средств, когда договор, указанный на момент платежа, отличается от фактически предоставленного содержания. Повторные платежи или ошибочные списания из-за системных ошибок также подлежат возврату. Причина возврата определяется путем сравнения договора на момент платежа с фактически выданными Lemons и преимуществами. Признание причины возврата и необходимые доказательства подробно определяются в политике возвратов.

  Когда возврат признан, оплаченные Lemons и бонусные преимущества, выданные этим платежом, подлежат отзыву. Если часть Lemons уже использована, использованная часть исключается из урегулирования. Бонусные Lemons могут обрабатываться отдельно в соответствии со сроком действия и условиями выдачи. Итоговые детали урегулирования и сумма возврата могут быть проверены до подтверждения запроса.

  В случае повторных платежей или непредоставления действительного результата по вине компании зарезервированные Lemons восстанавливаются или возвращаются в полном объеме. Сроки обработки и способ возврата следуют способу оплаты и применимому законодательству. Общая процедура возврата определяется совместно условиями сервиса, политикой кредитов и политикой возвратов. Статус возврата можно проверить в записях платежей и использования.
