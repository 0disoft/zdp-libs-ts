short: "Автопополнение автоматически пополняет заданную сумму, когда баланс лемонов опускается ниже порога. Пользователь может отключить его в любой момент. После отключения дополнительные пополнения не выполняются."
long: |-
  Автопополнение позволяет поддерживать баланс без ручного пополнения. Когда баланс опускается ниже установленного порога, автоматически списывается заданная сумма. История и суммы пополнений видны в записях платежей. Использовать автопополнение или нет — выбор пользователя.

  Автопополнение можно отключить в любое время, при этом останавливаются только будущие пополнения. Платежи, завершенные до отключения, следуют существующим критериям возврата. Суммы, списанные через автопополнение, также могут быть возвращены, как обычные платежи. После отключения пользователь может пополнять вручную по мере необходимости.

  На экране настроек автопополнения можно выбрать порог баланса и сумму пополнения. Изменения настроек и история отключения видны в сервисе. Ошибки, вызванные автопополнением, можно исправить через канал поддержки. Общие критерии устанавливаются политиками кредитов и возврата.
