short: "Чарджбэк — это процесс, при котором платеж возвращается через платежного провайдера после спора. Когда средства возвращаются по причинам, отличным от дублирования или ошибки, связанные бонусы также урегулируются. Использование этого платежа и его платных функций может быть ограничено до решения проблемы."
long: |-
  Чарджбэк — это процесс, в котором эмитент карты или платежный провайдер возвращает платеж из-за спора. Он может начаться, когда плательщик утверждает, что не одобрял платеж, или возникает спор об услуге. Компания проверяет причину и представляет необходимые доказательства. Результат чарджбэка отражается в статусе платежа и записях транзакций.

  Когда средства возвращаются через чарджбэк, купленные и бонусные Lemons, выданные этим платежом, подлежат возврату. Если часть Lemons уже использована, урегулирование покрывает только использованную часть. Платеж и соответствующая платная функция могут оставаться ограниченными до решения проблемы. Причина и прогресс четко сообщаются пользователю.

  Чарджбэк отличается от обычного возврата по процедуре. Возврат сначала обрабатывает сервис, а в чарджбэке участвует платежный провайдер. Если возражение не принято, платеж сохраняется, и история списаний остается прежней. Подробные стандарты можно найти в политике возвратов и кредитной политике.
