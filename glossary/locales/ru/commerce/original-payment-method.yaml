short: "Исходный способ оплаты — это средство, фактически использованное при оплате. Возврат в принципе осуществляется на этот способ. Фактический срок зачисления может зависеть от платежного провайдера."
long: |-
  Исходный способ оплаты означает карту или счет, которыми пользователь фактически заплатил. После подтверждения запроса на возврат оставшаяся сумма в принципе возвращается этим способом. В зависимости от графика обработки платежного провайдера может потребоваться дополнительное время. Статус зачисления можно проверить в записях платежей и использования.

  Если частичный возврат структурно невозможен исходным способом, предлагается альтернатива. Альтернативный способ и итоговая сумма сообщаются до подтверждения. Заменяющий возврат проводится только после согласия пользователя. Без согласия сохраняются критерии исходного способа.

  Сумма и способ возврата прозрачно отображаются в процессе запроса. Возвращаемые бонусные лемоны и преимущества также показываются на том же экране. Итоговые данные расчетов публикуются еще раз перед подтверждением. Соответствующие критерии устанавливаются политиками возврата и кредитов.
