short: "Lemon — это единая кредитная единица, используемая совместно в нескольких продуктах. Она делится на оплаченные Lemons, выдаваемые при покупке, и бесплатные Lemons, выдаваемые в качестве бонуса. Оплаченные Lemons могут подлежать возврату."
long: |-
  Lemon — это кредитная единица, используемая совместно в нескольких продуктах. Она делится на оплаченные Lemons, выдаваемые при покупке, и бесплатные Lemons, выдаваемые через события или вознаграждения. Каждый Lemon следует условиям срока действия и возможности возврата, установленным при выдаче. На экране баланса можно проверить источник и дату истечения каждого Lemon.

  Lemons списываются как единица, необходимая для использования сервиса. Фактическое списание применяется только к завершенной части задачи. Если задача не началась или действительный результат не получен по вине компании, зарезервированные Lemons восстанавливаются. Историю списаний можно проверить в записях платежей и использования.

  Бонусные Lemons могут иметь иной порядок использования, чем оплаченные Lemons. Бонусные Lemons расходуются в первую очередь начиная с самых ранних по сроку действия. Истекшие Lemons автоматически удаляются и не восстанавливаются. В целом правила выдачи, истечения и восстановления Lemons следуют критериям, установленным в политике кредитов.
