short: "Rate Limit — это техника, ограничивающая количество запросов, которые клиент может отправить в течение определённого временного окна. Основные цели — предотвращение злоупотреблений, поддержание стабильности и смягчение атак. Используются ответ HTTP 429 и алгоритмы, такие как token bucket и sliding window."
long: |-
  Rate Limit — это техника, ограничивающая количество запросов, которые сервер принимает в течение заданного периода. Клиенты не могут отправить больше запросов, чем установлено лимитом. Это ограничение защищает ресурсы сервера. Превышенные запросы могут быть отклонены или обработаны с задержкой.

  Основная цель — предотвратить злоупотребление запросами. Техника поддерживает стабильность, снижая нагрузку на сервер. Она смягчает последствия целенаправленных атак. Это также защищает опыт обычных пользователей.

  Состояние ограничения может передаваться через ответ HTTP 429. Для реализации часто используется алгоритм token bucket. Алгоритм sliding window также широко применяется. В зависимости от ситуации оба алгоритма можно комбинировать для более точного контроля.
