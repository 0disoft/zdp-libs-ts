short: "Маскирование — это метод обработки, при котором личная информация показывается со скрытыми частями. Операторы по умолчанию видят только маскированную информацию. Доступ к исходному содержимому предоставляется только с записанной причиной и объемом."
long: |-
  Маскирование — это метод отображения личной информации, такой как имена или данные аккаунта, с частями, замененными заглушками. Оно гарантирует, что видна только минимальная информация, необходимая для работы. В системах, обрабатывающих личную информацию, маскирование применяется как базовый принцип. Операторы и служба поддержки тоже по умолчанию видят только маскированную информацию.

  Некоторые задачи требуют исходного пользовательского контента или токенов внешних аккаунтов, которые нельзя маскировать. В таких исключительных случаях записываются причина, объем и срок действия. Запись доступа остается в журнале аудита для последующей проверки. Исключительный доступ ограничен минимально необходимым персоналом.

  Маскирование — это способ ограничения отображения, а не удаления данных. Хранящаяся исходная информация сохраняется по требуемым стандартам безопасности. Пользователи могут в любое время спросить, как обрабатывается их информация. Стандарты маскирования действуют согласно политике конфиденциальности.
