short: "API-ключ — это учетные данные аутентификации, которые программы используют для вызова функций сервиса. Его нужно беречь как пароль и никогда не раскрывать публично. Отправка API-ключа в поддержку может позволить другим злоупотребить вашим аккаунтом."
long: |-
  API-ключ — это секретная строка, которую программы или инструменты используют для безопасного вызова функций сервиса. Он подтверждает, что вызывающая сторона уполномочена выполнять задачи от имени пользователя. Если API-ключ раскрыт, другие могут использовать сервис с этим правом. Поэтому его нужно защищать на том же уровне, что и пароль.

  Не включайте API-ключи в обращения в поддержку. Содержимое обращения может проходить через нескольких сотрудников, поэтому контролировать объем распространения сложно. Другие учетные данные, такие как OAuth-токены, коды восстановления и приватные ключи, также отправлять нельзя. При необходимости объявляется отдельный безопасный путь сбора.

  Если вы считаете, что API-ключ был раскрыт, немедленно замените его новым ключом. Вы можете перевыпускать или отзывать ключи в любое время. Компания никогда не запрашивает ключи через каналы поддержки. Стандарты управления ключами можно найти в руководстве по безопасности каждого продукта.
