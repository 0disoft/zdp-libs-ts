short: "Vault — это система для шифрования и управления секретами. Она включает функции учёта доступа, истечения срока действия, журналов аудита и динамического создания секретов. Она надёжно защищает ключи API, пароли баз данных, сертификаты и токены."
long: |-
  Vault — это система для безопасного хранения и управления секретами. Секретами называются такие значения, как ключи API, пароли баз данных, сертификаты и токены. При хранении применяется шифрование для предотвращения внешних утечек. В системе фиксируется, кто и когда получал доступ.

  Доступ можно контролировать с высокой степенью детализации. Определённые секреты автоматически истекают по прошествии заданного времени. Функция истечения срока помогает снизить последствия утечки секрета. История доступа отслеживается через журналы аудита.

  Секреты также можно создавать динамически. Этот подход создаёт кратковременные временные секреты. Временные секреты имеют меньший риск длительной утечки. В целом это повышает стабильность и гибкость управления секретами.
