short: "Токен — это учетные данные доступа, которые представляют подключение к внешнему аккаунту. Он позволяет только ограниченный доступ вместо полного доступа по паролю. Сохраненные токены удаляются при отзыве подключения."
long: |-
  Токен — это учетные данные доступа, выдаваемые, когда вы разрешаете подключение внешнего сервиса. Вместо полного доступа, как пароль, он позволяет только разрешенный объем. Внешний сервис использует токен для выполнения ограниченных задач от вашего имени. Токен — это не пароль, и при необходимости его можно перевыпустить.

  Сохраненные токены используются только для выполнения подключенной функции. Ситуации, требующие доступа к токену, записываются с причиной и объемом. При отключении новый доступ немедленно прекращается. После отключения сохраненные токены и кэшированные данные удаляются.

  Политика конфиденциальности прозрачно раскрывает, как токены собираются, хранятся и удаляются. Токены хранятся отдельно и безопасно от обычных данных. При обнаружении подозрительного доступа токены можно отозвать и перевыпустить. Вы можете просматривать и отзывать разрешения в любое время в списке подключений.
