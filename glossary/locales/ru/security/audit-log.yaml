short: "Журнал аудита — это запись о безопасности, показывающая, кто и когда получил доступ к какой информации. Исключительный доступ записывается с причиной, объемом и сроком действия. Инциденты безопасности расследуются по этим записям."
long: |-
  Журнал аудита — это хронологическая запись основных доступов и изменений в системе. Он позволяет проверить, кто, когда и с какой целью получил доступ к какой информации. Обычные рабочие записи также включаются и происходят только в рамках разрешенных полномочий. Записи защищены так, чтобы их было трудно подделать или удалить.

  Исключительный доступ к сырому личному содержимому или токенам внешних аккаунтов всегда фиксируется в журнале аудита. Причина, объем и срок действия записываются вместе для обеспечения прозрачности. При подозрении на инцидент безопасности или мошенничество эти записи используются для выяснения причины. Доступ к самим журналам также отдельно ограничен.

  Журнал аудита — это базовый механизм безопасной обработки личной информации. Политика конфиденциальности раскрывает стандарты ведения журналов аудита. Доступ к данным пользователя сводится к минимуму и всегда фиксируется. Ненужные записи удаляются в соответствии с установленным сроком хранения.
