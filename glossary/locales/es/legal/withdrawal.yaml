short: "El desistimiento es un sistema que permite retirar el contrato dentro de un periodo determinado después de su celebración. En el servicio, sirve de base cuando las condiciones de concesión de los Lemons de pago se cumplen de forma diferente al contrato. El periodo y el procedimiento concretos siguen los criterios establecidos en la política de reembolso."
long: |-
  El desistimiento es el derecho del consumidor a dejar sin efecto el contrato dentro de un periodo determinado después de celebrarlo. Se utiliza como criterio de juicio cuando el anuncio, la publicidad o el contenido del contrato difieren de lo realmente proporcionado. Si la solicitud se presenta dentro del plazo establecido por la ley y los términos, se reconoce su eficacia. Cuando se reconoce el desistimiento, se devuelve el importe correspondiente a ese contrato.

  En el servicio, el desistimiento se plantea cuando la concesión de Lemons o la prestación del servicio difieren del contenido del contrato. Los pagos duplicados o las concesiones incorrectas debidas a errores de la empresa también son objeto de corrección. Si se reconoce o no el motivo del desistimiento se determina comparando el contrato del momento del pago con la prestación real. Los criterios de juicio y las pruebas necesarias se detallan en la política de reembolso.

  Cuando se reconoce el desistimiento, los Lemons y beneficios concedidos por ese pago pasan a ser objeto de recuperación. Si hay Lemons ya utilizados, la liquidación excluye la parte utilizada. El importe final del reembolso y el detalle de la recuperación pueden consultarse antes de confirmar la solicitud. El procedimiento general de desistimiento y los plazos de tramitación los establecen conjuntamente la legislación aplicable, los términos y la política de reembolso.
