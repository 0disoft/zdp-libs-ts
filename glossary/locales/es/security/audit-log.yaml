id: security.audit-log
label: Registro de auditoría
slug: audit-log
copy_contract_version: 2
copy_provenance:
  origin: llm
  human_review_status: pending
short: "Un registro de auditoría es un historial de seguridad de quién accedió a qué información y cuándo. El acceso excepcional se registra con el motivo, el alcance y la expiración. Los incidentes de seguridad se investigan mediante estos registros."
long: |-
  Un registro de auditoría es un historial cronológico de los principales accesos y cambios en un sistema. Permite verificar quién accedió a qué información, cuándo y con qué fin. Los registros de trabajo normales se incluyen y solo ocurren dentro de la autoridad permitida. Los registros están protegidos para que sean difíciles de falsificar o eliminar.

  El acceso excepcional a contenido personal bruto o tokens de cuentas externas siempre queda en el registro de auditoría. El motivo, el alcance y la expiración se registran juntos para garantizar la transparencia. Cuando se sospecha un incidente de seguridad o un uso fraudulento, estos registros se usan para rastrear la causa. El acceso a los propios registros también está restringido por separado.

  Un registro de auditoría es una salvaguarda básica para manejar información personal de forma segura. La política de privacidad divulga cómo se operan los registros de auditoría. El acceso a los datos del usuario se mantiene al mínimo y siempre se registra. Los registros que ya no se necesitan se eliminan según el período de retención establecido.
