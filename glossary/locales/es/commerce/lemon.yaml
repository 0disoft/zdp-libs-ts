short: "Lemon es la unidad de crédito integrada que se utiliza de forma común en varios productos. Se divide en Lemons de pago, concedidos al comprar, y Lemons gratuitos, concedidos como bonificación. Los Lemons de pago pueden ser objeto de reembolso."
long: |-
  Lemon es la unidad de crédito que se utiliza de forma común en varios productos. Se divide en Lemons de pago, concedidos mediante la compra, y Lemons gratuitos, concedidos mediante eventos o recompensas. Cada Lemon sigue las condiciones de validez y reembolsabilidad establecidas en el momento de la concesión. En la pantalla de saldo pueden consultarse el origen y la fecha de caducidad de cada Lemon.

  Los Lemons se deducen como la unidad necesaria para utilizar el servicio. La deducción real se aplica solo al alcance completado de la tarea. Si la tarea no ha comenzado o no se recibió un resultado válido por responsabilidad de la empresa, los Lemons reservados se restablecen. El historial de deducciones puede consultarse en los registros de pago y uso.

  Los Lemons de bonificación pueden tener un orden de uso diferente al de los Lemons de pago. Los Lemons de bonificación se consumen primero desde la fecha de caducidad más próxima. Los Lemons caducados se eliminan automáticamente y no se restablecen. En general, las reglas de concesión, caducidad y restablecimiento de los Lemons siguen los criterios establecidos en la política de créditos.
