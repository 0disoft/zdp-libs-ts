short: "El derecho de uso es la autorización de una cuenta para utilizar un producto específico o una función de pago. Solo crear una cuenta no otorga automáticamente todos los derechos. Los derechos reales varían según la edad, el país de residencia, el medio de pago y las condiciones del producto."
long: |-
  El derecho de uso es una autorización que se aplica de forma diferente a cada servicio aunque una cuenta inicie sesión en varios productos. El simple hecho de crear una cuenta no genera derechos sobre todos los productos o funciones de pago. Los derechos reales se determinan según la política y el estado de disponibilidad de cada producto. Si se tiene o no un derecho puede consultarse en la pantalla de cada producto después de iniciar sesión.

  El derecho de uso se gestiona junto con el estado de la cuenta y el método de inicio de sesión. Mantener actualizada la información de la cuenta permite juzgar los derechos con precisión. No se permite prestar ni vender la cuenta o el método de inicio de sesión a otras personas. Intentar usar una función sin el derecho requerido puede dar lugar a una restricción de acceso.

  Algunos derechos están adicionalmente limitados por la edad, el país de residencia, el medio de pago o las características del producto. Un derecho restringido puede volver a otorgarse cuando se cumplen las condiciones. Si se cumplen o no las condiciones se juzga según los criterios indicados en la pantalla del servicio. Los criterios generales de concesión y restricción de derechos se establecen en los términos del servicio y en la guía de cada producto.
