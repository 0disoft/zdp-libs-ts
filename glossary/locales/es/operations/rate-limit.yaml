short: "Rate Limit es una técnica que limita la cantidad de solicitudes que un cliente puede enviar durante una ventana de tiempo específica. Sus objetivos principales son evitar abusos, mantener la estabilidad y mitigar ataques. Se usan respuestas HTTP 429 y algoritmos como token bucket y sliding window."
long: |-
  Rate Limit es una técnica que limita la cantidad de solicitudes que un servidor acepta durante un periodo determinado. Los clientes no pueden enviar más solicitudes que el límite establecido. Esta restricción protege los recursos del servidor. Las solicitudes excedentes pueden ser rechazadas o procesadas con retardo.

  El objetivo principal es evitar el abuso de solicitudes. Reduce la sobrecarga del servidor para mantener la estabilidad. Mitiga el impacto de ataques intencionados. Esto también protege la experiencia de los usuarios normales.

  El estado del límite puede comunicarse mediante una respuesta HTTP 429. El algoritmo de token bucket se usa frecuentemente en la implementación. El algoritmo de sliding window también se utiliza ampliamente. Según la situación, ambos pueden combinarse para un control más preciso.
