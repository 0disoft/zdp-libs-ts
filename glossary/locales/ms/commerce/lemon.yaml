short: "Lemon ialah unit kredit bersepadu yang digunakan secara bersama dalam pelbagai produk. Ia terbahagi kepada Lemon berbayar yang diberikan semasa pembelian dan Lemon percuma yang diberikan sebagai bonus. Lemon berbayar boleh menjadi objek bayaran balik."
long: |-
  Lemon ialah unit kredit yang digunakan secara bersama dalam pelbagai produk. Ia terbahagi kepada Lemon berbayar yang diberikan melalui pembelian dan Lemon percuma yang diberikan melalui acara atau ganjaran. Setiap Lemon mengikut syarat tempoh sah dan bayaran balik yang ditetapkan semasa pemberian. Pada skrin baki, sumber dan tarikh luput setiap Lemon boleh disemak.

  Lemon ditolak sebagai unit yang diperlukan untuk menggunakan perkhidmatan. Potongan sebenar hanya digunakan pada skop tugasan yang selesai. Jika tugasan belum bermula atau hasil yang sah tidak diterima disebabkan kesalahan syarikat, Lemon yang ditempah akan dipulihkan. Sejarah potongan boleh disemak dalam rekod pembayaran dan penggunaan.

  Lemon bonus mungkin mempunyai susunan penggunaan yang berbeza daripada Lemon berbayar. Lemon bonus digunakan dahulu bermula daripada yang tempoh sahnya paling pendek. Lemon yang luput dipadam secara automatik dan tidak dipulihkan. Secara keseluruhan, peraturan pemberian, luput, dan pemulihan Lemon mengikut kriteria yang ditetapkan dalam dasar kredit.
