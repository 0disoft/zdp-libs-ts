short: "Hak penggunaan ialah kuasa akaun untuk menggunakan produk tertentu atau ciri berbayar. Mencipta akaun sahaja tidak memberikan semua hak secara automatik. Hak sebenar berbeza-beza bergantung pada umur, negara kediaman, kaedah pembayaran, dan syarat produk."
long: |-
  Hak penggunaan ialah kuasa yang digunakan secara berbeza pada setiap perkhidmatan walaupun satu akaun log masuk ke pelbagai produk. Fakta mencipta akaun sahaja tidak mewujudkan hak ke atas semua produk atau ciri berbayar. Hak sebenar ditentukan berdasarkan dasar dan ketersediaan setiap produk. Ada atau tiadanya hak boleh disemak pada skrin setiap produk selepas log masuk.

  Hak penggunaan diuruskan bersama dengan status akaun dan kaedah log masuk. Mengekalkan maklumat akaun terkini menjadikan penilaian hak tepat. Meminjamkan atau menjual akaun atau kaedah log masuk kepada orang lain tidak dibenarkan. Mencuba menggunakan ciri tanpa hak yang diperlukan boleh mengakibatkan sekatan akses.

  Sebahagian hak disekat lagi oleh umur, negara kediaman, kaedah pembayaran, atau ciri produk. Hak yang disekat boleh diberikan semula apabila syarat dipenuhi. Sama ada syarat dipenuhi dinilai berdasarkan kriteria yang dimaklumkan pada skrin perkhidmatan. Kriteria keseluruhan pemberian dan sekatan hak ditetapkan oleh terma perkhidmatan dan panduan setiap produk.
