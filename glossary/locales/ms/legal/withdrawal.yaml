short: "Penarikan ialah sistem yang membolehkan kontrak ditarik balik dalam tempoh tertentu selepas kontrak dibuat. Dalam perkhidmatan, penarikan menjadi asas apabila syarat pemberian Lemon berbayar dilaksanakan secara berbeza daripada kontrak. Tempoh dan prosedur yang konkrit mengikut kriteria yang ditetapkan dalam dasar bayaran balik."
long: |-
  Penarikan ialah hak pengguna untuk menjadikan kontrak tidak berkuat kuasa dalam tempoh tertentu selepas membuat kontrak. Ia digunakan sebagai kriteria penilaian apabila paparan, iklan, atau kandungan kontrak berbeza daripada apa yang benar-benar diberikan. Jika permintaan dikemukakan dalam tempoh yang ditetapkan oleh undang-undang dan terma, kesannya diiktiraf. Apabila penarikan diiktiraf, wang untuk kontrak tersebut dipulangkan.

  Dalam perkhidmatan, penarikan menjadi persoalan apabila pemberian Lemon atau penyediaan perkhidmatan berbeza daripada kandungan kontrak. Pembayaran berganda atau pemberian yang salah disebabkan kesalahan syarikat juga menjadi objek pembetulan. Sama ada sebab penarikan diiktiraf dinilai dengan membandingkan kontrak pada masa pembayaran dengan pelaksanaan sebenar. Kriteria penilaian dan bukti yang diperlukan dimaklumkan secara terperinci dalam dasar bayaran balik.

  Apabila penarikan diiktiraf, Lemon dan manfaat yang diberikan oleh pembayaran tersebut menjadi objek penarikan semula. Jika terdapat Lemon yang telah digunakan, bahagian yang digunakan dikecualikan daripada penyelesaian. Jumlah bayaran balik akhir dan butiran penarikan semula boleh disemak sebelum permintaan disahkan. Prosedur penarikan secara keseluruhan dan had masa pemprosesan ditetapkan bersama oleh undang-undang yang terpakai, terma, dan dasar bayaran balik.
