short: "API कुंजी एक प्रमाणीकरण प्रमाणपत्र है जिसका उपयोग प्रोग्राम सेवा सुविधाओं को कॉल करने के लिए करते हैं. इसे पासवर्ड की तरह रखा जाना चाहिए और सार्वजनिक रूप से कभी साझा नहीं करना चाहिए. समर्थन को API कुंजी भेजने से दूसरे आपके खाते का दुरुपयोग कर सकते हैं."
long: |-
  API कुंजी एक गुप्त स्ट्रिंग है जिसका उपयोग प्रोग्राम या उपकरण सेवा सुविधाओं को सुरक्षित रूप से कॉल करने के लिए करते हैं. यह साबित करती है कि कॉल करने वाला उपयोगकर्ता की ओर से कार्य चलाने के लिए अधिकृत है. यदि API कुंजी उजागर हो जाती है, तो अन्य लोग उस अधिकार के साथ सेवा का उपयोग कर सकते हैं. इसलिए इसे पासवर्ड के समान स्तर पर संरक्षित किया जाना चाहिए.

  समर्थन पूछताछ में API कुंजियाँ शामिल न करें. पूछताछ की सामग्री कई कर्मचारियों से होकर गुजर सकती है, इसलिए साझाकरण दायरे को नियंत्रित करना कठिन है. OAuth टोकन, रिकवरी कोड और प्राइवेट कुंजी जैसे अन्य प्रमाणपत्र भी नहीं भेजने चाहिए. आवश्यकता पड़ने पर अलग सुरक्षित संग्रह मार्ग की सूचना दी जाती है.

  यदि आपको लगता है कि API कुंजी उजागर हो गई है, तो तुरंत नई कुंजी से बदलें. आप कुंजियाँ किसी भी समय पुनः जारी या रद्द कर सकते हैं. कंपनी समर्थन चैनलों के माध्यम से कभी कुंजी नहीं माँगती. कुंजी प्रबंधन मानक प्रत्येक उत्पाद की सुरक्षा मार्गदर्शिका में मिलते हैं.
