short: "मास्किंग एक प्रसंस्करण विधि है जो व्यक्तिगत जानकारी को कुछ भाग छिपाकर दिखाती है. ऑपरेटर डिफ़ॉल्ट रूप से केवल मास्क की गई जानकारी देख सकते हैं. मूल सामग्री तक पहुँच केवल दर्ज किए गए कारण और दायरे के साथ दी जाती है."
long: |-
  मास्किंग नाम या खाता विवरण जैसी व्यक्तिगत जानकारी के कुछ भागों को प्रतीकों से बदलकर दिखाने की विधि है. यह सुनिश्चित करता है कि काम के लिए आवश्यक न्यूनतम जानकारी ही दिखे. व्यक्तिगत जानकारी संभालने वाले सिस्टम में मास्किंग मूल सिद्धांत के रूप में लागू होती है. ऑपरेटर और समर्थन कर्मचारी भी डिफ़ॉल्ट रूप से केवल मास्क की गई जानकारी देखते हैं.

  कुछ कार्यों के लिए मूल उपयोगकर्ता सामग्री या बाहरी खाता टोकन की आवश्यकता होती है जिन्हें मास्क नहीं किया जा सकता. ऐसे असाधारण मामलों में कारण, दायरा और समाप्ति समय दर्ज किया जाता है. पहुँच रिकॉर्ड ऑडिट लॉग के रूप में बाद की समीक्षा के लिए रहता है. असाधारण पहुँच केवल आवश्यक न्यूनतम कर्मचारियों तक सीमित होती है.

  मास्किंग डेटा हटाने का तरीका नहीं, बल्कि प्रदर्शन सीमित करने का तरीका है. संग्रहीत मूल जानकारी आवश्यक सुरक्षा मानकों के साथ रखी जाती है. उपयोगकर्ता किसी भी समय अपनी जानकारी के प्रसंस्करण के बारे में पूछ सकते हैं. मास्किंग मानक गोपनीयता नीति के अनुसार संचालित होते हैं.
