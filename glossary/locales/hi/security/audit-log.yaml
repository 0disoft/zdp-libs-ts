short: "ऑडिट लॉग एक सुरक्षा रिकॉर्ड है जो बताता है कि किसने कौन सी जानकारी और कब एक्सेस की. असाधारण पहुँच कारण, दायरे और समाप्ति के साथ दर्ज की जाती है. सुरक्षा घटनाओं की जाँच इन रिकॉर्डों से की जाती है."
long: |-
  ऑडिट लॉग किसी सिस्टम में प्रमुख पहुँच और परिवर्तनों का कालानुक्रमिक रिकॉर्ड है. यह सत्यापित करने में मदद करता है कि किसने, कब और किस उद्देश्य से कौन सी जानकारी एक्सेस की. सामान्य कार्य रिकॉर्ड भी शामिल हैं और केवल अनुमत अधिकार के भीतर होते हैं. रिकॉर्ड ऐसे संरक्षित होते हैं कि उन्हें जाली बनाना या हटाना कठिन हो.

  मूल व्यक्तिगत सामग्री या बाहरी खाता टोकन तक असाधारण पहुँच हमेशा ऑडिट लॉग में दर्ज होती है. कारण, दायरा और समाप्ति समय एक साथ दर्ज किए जाते हैं ताकि पारदर्शिता बनी रहे. जब सुरक्षा घटना या धोखाधड़ी का संदेह होता है, तो इन रिकॉर्डों से कारण का पता लगाया जाता है. लॉग तक पहुँच भी अलग से प्रतिबंधित होती है.

  ऑडिट लॉग व्यक्तिगत जानकारी को सुरक्षित रूप से संभालने का मूल सुरक्षा उपाय है. गोपनीयता नीति बताती है कि ऑडिट लॉग कैसे संचालित होते हैं. उपयोगकर्ता डेटा तक पहुँच न्यूनतम रखी जाती है और हमेशा दर्ज होती है. अनावश्यक रिकॉर्ड निर्धारित अवधि के अनुसार हटा दिए जाते हैं.
