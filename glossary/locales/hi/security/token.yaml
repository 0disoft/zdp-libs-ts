short: "टोकन एक पहुँच प्रमाणपत्र है जो बाहरी खाते के कनेक्शन का प्रतिनिधित्व करता है. यह पूर्ण पासवर्ड पहुँच के बजाय केवल सीमित दायरा देता है. कनेक्शन वापस लेने पर संग्रहीत टोकन हटा दिए जाते हैं."
long: |-
  टोकन एक पहुँच प्रमाणपत्र है जो तब जारी होता है जब आप बाहरी सेवा कनेक्शन की अनुमति देते हैं. पासवर्ड की तरह पूर्ण पहुँच देने के बजाय यह केवल अनुमत दायरे की अनुमति देता है. बाहरी सेवा आपकी ओर से सीमित कार्य करने के लिए टोकन का उपयोग करती है. टोकन पासवर्ड नहीं है और आवश्यकता पड़ने पर पुनः जारी किया जा सकता है.

  संग्रहीत टोकन केवल कनेक्टेड सुविधा चलाने के लिए उपयोग होते हैं. टोकन पहुँच की आवश्यकता वाली स्थितियाँ कारण और दायरे के साथ दर्ज की जाती हैं. जब आप कनेक्शन हटाते हैं, नई पहुँच तुरंत रोक दी जाती है. हटाने के बाद संग्रहीत टोकन और कैश्ड डेटा हटा दिए जाते हैं.

  गोपनीयता नीति पारदर्शी रूप से बताती है कि टोकन कैसे एकत्र, संग्रहीत और हटाए जाते हैं. टोकन सामान्य डेटा से अलग और सुरक्षित रूप से रखे जाते हैं. संदिग्ध पहुँच का पता चलने पर टोकन रद्द और पुनः जारी किए जा सकते हैं. आप कनेक्शन सूची से किसी भी समय अनुमतियाँ देख और वापस ले सकते हैं.
