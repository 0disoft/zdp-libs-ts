short: "स्वचालित रिचार्ज एक सुविधा है जो लेमन शेष सीमा से नीचे जाने पर निर्धारित राशि स्वतः जोड़ देती है. उपयोगकर्ता इसे कभी भी रद्द कर सकता है. रद्द करने के बाद कोई अतिरिक्त रिचार्ज नहीं होता."
long: |-
  स्वचालित रिचार्ज उपयोगकर्ता को मैन्युअल रिचार्ज के बिना शेष बनाए रखने में मदद करता है. शेष निर्धारित सीमा से कम होने पर निर्धारित राशि स्वतः जोड़ी जाती है. रिचार्ज इतिहास और राशि भुगतान रिकॉर्ड में देखी जा सकती है. स्वचालित रिचार्ज का उपयोग करना उपयोगकर्ता का अपना निर्णय है.

  स्वचालित रिचार्ज कभी भी रद्द किया जा सकता है, जिससे केवल भविष्य के रिचार्ज रुकते हैं. रद्द करने से पहले पूरे किए गए भुगतान मौजूदा रिफंड मानदंडों का पालन करते हैं. स्वचालित रिचार्ज से जोड़ी गई राशि भी सामान्य भुगतान की तरह रिफंड योग्य हो सकती है. रद्द करने के बाद उपयोगकर्ता आवश्यकतानुसार मैन्युअल रिचार्ज कर सकता है.

  स्वचालित रिचार्ज सेटिंग स्क्रीन पर सीमा शेष और रिचार्ज राशि चुनी जा सकती है. सेटिंग बदलाव और रद्द इतिहास सेवा स्क्रीन पर दिखाई देते हैं. स्वचालित रिचार्ज से हुई त्रुटियाँ सहायता चैनल से सुधारी जा सकती हैं. समग्र मानदंड क्रेडिट और रिफंड नीतियों द्वारा निर्धारित होते हैं.
