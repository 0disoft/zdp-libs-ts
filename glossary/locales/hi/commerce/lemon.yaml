short: "Lemon एक एकीकृत क्रेडिट इकाई है जिसका उपयोग कई उत्पादों में साझा रूप से किया जाता है. यह खरीद पर दिए जाने वाले सशुल्क Lemons और बोनस के रूप में दिए जाने वाले मुफ्त Lemons में विभाजित होता है. सशुल्क Lemons धनवापसी के दायरे में आ सकते हैं."
long: |-
  Lemon एक क्रेडिट इकाई है जिसका उपयोग कई उत्पादों में साझा रूप से किया जाता है. यह खरीद के माध्यम से दिए जाने वाले सशुल्क Lemons और इवेंट या पुरस्कार के माध्यम से दिए जाने वाले मुफ्त Lemons में विभाजित होता है. प्रत्येक Lemon देने के समय तय की गई वैधता अवधि और धनवापसी की शर्तों का पालन करता है. शेष राशि स्क्रीन पर प्रत्येक Lemon के स्रोत और समाप्ति तिथि को देखा जा सकता है.

  Lemons सेवा उपयोग के लिए आवश्यक इकाई के रूप में काटे जाते हैं. वास्तविक कटौती केवल पूर्ण हुए कार्य के दायरे पर लागू होती है. यदि कार्य शुरू नहीं हुआ है या कंपनी की गलती के कारण वैध परिणाम नहीं मिला है तो आरक्षित Lemons बहाल किए जाते हैं. कटौती का इतिहास भुगतान और उपयोग रिकॉर्ड में देखा जा सकता है.

  बोनस Lemons का उपयोग क्रम सशुल्क Lemons से भिन्न हो सकता है. बोनस Lemons सबसे कम वैधता अवधि वाले से पहले उपयोग किए जाते हैं. समाप्त हो चुके Lemons स्वतः हटा दिए जाते हैं और बहाल नहीं होते. कुल मिलाकर Lemons के देने, समाप्ति और बहाली के नियम क्रेडिट नीति में तय किए गए मानदंडों का पालन करते हैं.
