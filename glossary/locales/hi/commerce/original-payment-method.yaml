short: "मूल भुगतान विधि वह साधन है जिसका उपयोग भुगतान के समय वास्तव में किया गया था. रिफंड सिद्धांततः इसी विधि पर लौटते हैं. वास्तविक समय भुगतान प्रदाता के अनुसार भिन्न हो सकता है."
long: |-
  मूल भुगतान विधि का अर्थ उस कार्ड या खाते से है जिससे उपयोगकर्ता ने वास्तव में भुगतान किया. रिफंड अनुरोध की पुष्टि के बाद शेष राशि सिद्धांततः इसी विधि से लौटाई जाती है. भुगतान प्रदाता की प्रक्रिया अनुसूची के अनुसार अतिरिक्त समय लग सकता है. स्थिति भुगतान और उपयोग रिकॉर्ड में देखी जा सकती है.

  यदि मूल विधि से आंशिक रिफंड संरचनात्मक रूप से असंभव है, तो विकल्प दिया जाता है. वैकल्पिक विधि और अंतिम राशि पुष्टि से पहले बताई जाती है. प्रतिस्थापन रिफंड केवल उपयोगकर्ता की सहमति के बाद आगे बढ़ता है. सहमति न होने पर मूल विधि के मानदंड लागू रहते हैं.

  रिफंड राशि और विधि अनुरोध प्रक्रिया के दौरान पारदर्शी रूप से दिखाई जाती है. वसूले गए बोनस लेमन और लाभ भी उसी स्क्रीन पर दिखाए जाते हैं. अंतिम निपटान विवरण पुष्टि से पहले फिर से प्रकट किया जाता है. संबंधित मानदंड रिफंड और क्रेडिट नीतियों द्वारा निर्धारित होते हैं.
