short: "धनवापसी वह प्रक्रिया है जिसमें सेवा की पूर्ति अनुबंध से भिन्न होने या डुप्लिकेट भुगतान की पुष्टि होने पर राशि लौटाई जाती है. सशुल्क Lemons उपयोग की गई मात्रा को छोड़कर निपटाए जाते हैं. शेष राशि धनवापसी नीति के अनुसार लौटाई जाती है."
long: |-
  धनवापसी वह प्रक्रिया है जिसमें भुगतान के समय बताया गया अनुबंध वास्तव में दी गई सामग्री से भिन्न होने पर राशि लौटाई जाती है. डुप्लिकेट भुगतान या सिस्टम त्रुटि के कारण हुई गलत वसूली भी धनवापसी के दायरे में आती है. धनवापसी का कारण भुगतान के समय के अनुबंध और वास्तव में दिए गए Lemons और लाभों की तुलना करके तय किया जाता है. धनवापसी का कारण स्वीकार होगा या नहीं और किन साक्ष्यों की आवश्यकता है यह धनवापसी नीति में विस्तार से तय होता है.

  जब धनवापसी स्वीकार होती है तो उस भुगतान से दिए गए सशुल्क Lemons और बोनस लाभ वापस लेने के दायरे में आते हैं. यदि कुछ Lemons पहले ही उपयोग हो चुके हैं तो उपयोग की गई मात्रा को छोड़कर निपटान किया जाता है. बोनस Lemons को वैधता अवधि और देने की शर्तों के अनुसार अलग से संभाला जा सकता है. अंतिम निपटान विवरण और धनवापसी राशि अनुरोध की पुष्टि से पहले देखी जा सकती है.

  डुप्लिकेट भुगतान या कंपनी की गलती के कारण वैध परिणाम न दे पाने के मामले में आरक्षित Lemons बहाल किए जाते हैं या पूरी राशि लौटाई जाती है. प्रसंस्करण समय सीमा और लौटाने का तरीका भुगतान माध्यम और लागू कानून के अनुसार होता है. समग्र धनवापसी प्रक्रिया सेवा नियम, क्रेडिट नीति और धनवापसी नीति द्वारा मिलकर तय होती है. धनवापसी की स्थिति भुगतान और उपयोग रिकॉर्ड में देखी जा सकती है.
