short: "चार्जबैक एक ऐसी प्रक्रिया है जिसमें भुगतान विवाद के बाद भुगतान प्रदाता के माध्यम से राशि वापस की जाती है. जब धन डुप्लिकेट या त्रुटि के अलावा अन्य कारणों से वसूला जाता है, तो संबंधित लाभ भी निपटाए जाते हैं. समस्या हल होने तक उस भुगतान और उसकी सशुल्क सुविधाओं का उपयोग प्रतिबंधित हो सकता है."
long: |-
  चार्जबैक एक ऐसी प्रक्रिया है जिसमें कार्ड जारीकर्ता या भुगतान प्रदाता विवाद के कारण भुगतान वसूल करता है. यह तब शुरू हो सकता है जब भुगतानकर्ता दावा करे कि उसने भुगतान स्वीकृत नहीं किया या सेवा विवाद उत्पन्न हो. कंपनी कारण की समीक्षा करती है और आवश्यक साक्ष्य प्रस्तुत करती है. चार्जबैक परिणाम भुगतान स्थिति और लेनदेन रिकॉर्ड में दिखाई देता है.

  जब चार्जबैक के माध्यम से धन वसूला जाता है, तो उस भुगतान से दिए गए खरीदे और बोनस Lemons वसूली के दायरे में आ जाते हैं. यदि कुछ Lemons पहले ही उपयोग हो चुके हैं, तो निपटान केवल उपयोग किए गए हिस्से को कवर करता है. समस्या हल होने तक भुगतान और वह सशुल्क सुविधा प्रतिबंधित रह सकती है. कारण और प्रगति उपयोगकर्ता को स्पष्ट रूप से बताई जाती है.

  चार्जबैक सामान्य धनवापसी से प्रक्रिया में भिन्न है. धनवापसी पहले सेवा द्वारा संभाली जाती है, जबकि चार्जबैक में भुगतान प्रदाता शामिल होता है. यदि आपत्ति स्वीकार नहीं होती, तो भुगतान बना रहता है और कटौती इतिहास भी वैसा ही रहता है. विस्तृत मानदंड धनवापसी नीति और क्रेडिट नीति में देखे जा सकते हैं.
