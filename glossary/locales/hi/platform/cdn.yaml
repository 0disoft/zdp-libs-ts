short: "CDN एक नेटवर्क है जो फ़ाइलों को कई सर्वरों पर संग्रहीत करता है और उन्हें नज़दीकी स्थान से तेज़ी से वितरित करता है. यह किसी साइट के फ़ॉन्ट और स्क्रिप्ट जैसी साझा फ़ाइलें प्रदान करता है. अनुरोध के दौरान पहुँच IP पता CDN प्रदाता को प्रेषित किया जा सकता है."
long: |-
  CDN का अर्थ Content Delivery Network है और यह फ़ाइलों को कई क्षेत्रों के सर्वरों पर कॉपी करके और आपके सबसे नज़दीकी सर्वर से वितरित करके काम करता है. इसका उपयोग फ़ॉन्ट, स्क्रिप्ट और चित्र जैसी साझा फ़ाइलों को तेज़ी और विश्वसनीय रूप से वितरित करने के लिए होता है. अनुरोध एक सर्वर पर भार डालने के बजाय क्षेत्रीय सर्वरों में बाँटे जाते हैं. पृष्ठ लोड होने की अनुभवित गति भी सुधरती है.

  यह साइट फ़ॉन्ट वितरण के लिए jsDelivr CDN का उपयोग करती है. पृष्ठ खोलने पर फ़ाइलों के लिए CDN सर्वर पर अनुरोध बनता है. अनुरोध आपके पहुँच IP पते और बुनियादी ब्राउज़र जानकारी को CDN प्रदाता को प्रेषित कर सकता है. प्रेषित जानकारी फ़ाइलें वितरित करने के लिए आवश्यक न्यूनतम है.

  गोपनीयता नीति CDN उपयोग और संसाधित जानकारी को पारदर्शी रूप से प्रकट करती है. विस्तृत स्थिति CDN प्रदाता की उप-प्रोसेसर सूचना में भी उपलब्ध है. CDN ऐसा बुनियादी ढांचा है जो वितरण मार्ग को तेज़ करता है, न कि सामग्री संग्रहीत या विश्लेषण करने वाला उपकरण. सेवा बढ़ने पर अतिरिक्त CDN या होस्टिंग प्रदाता जोड़े जा सकते हैं और पहले से सूचित किए जाएँगे.
