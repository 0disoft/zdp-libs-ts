short: "कुकी एक छोटी फ़ाइल है जिसे कोई साइट आपके ब्राउज़र में संग्रहीत करती है. यह भाषा, थीम और फ़ॉन्ट आकार जैसी प्रदर्शन सेटिंग्स को याद रखती है. आवश्यक कुकीज़ सेवा का समर्थन करती हैं और वैकल्पिक कुकीज़ को अस्वीकार किया जा सकता है."
long: |-
  कुकी एक छोटी सूचना फ़ाइल है जिसे आपके द्वारा देखी गई साइट आपके ब्राउज़र में छोड़ती है. यह प्रदर्शन प्राथमिकताओं को याद रखती है ताकि अगली यात्रा पर वही वातावरण दिखे. यह ब्राउज़र के भीतर चुनावों का रिकॉर्ड है, न कि पहचान दस्तावेज़. आप इन सेटिंग्स को ब्राउज़र में कभी भी देख और साफ़ कर सकते हैं.

  आवश्यक कुकीज़ सेवा के सही काम करने के लिए आवश्यक न्यूनतम कार्य संभालती हैं. वैकल्पिक कुकीज़ विज्ञापन या विश्लेषण जैसे अतिरिक्त कार्यों के लिए उपयोग हो सकती हैं. वैकल्पिक कुकीज़ को सहमति प्रबंधन या ब्राउज़र सेटिंग्स के माध्यम से अस्वीकार किया जा सकता है. उन्हें अस्वीकार करने से बुनियादी सेवा उपयोग सीमित नहीं होता.

  गोपनीयता नीति पारदर्शी रूप से बताती है कि कौन सी कुकी किस उद्देश्य से उपयोग होती है. जब तीसरे पक्ष के उपकरण कुकी का उपयोग करते हैं तो प्रदाता और उद्देश्य की सूचना साथ दी जाती है. आप यात्रा के बाद किसी भी समय कुकी सेटिंग्स बदल सकते हैं. ब्राउज़र में सभी कुकी साफ़ करने से आपका खाता स्वयं नहीं हटता.
