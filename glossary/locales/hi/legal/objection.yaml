short: "आपत्ति एक ऐसी प्रक्रिया है जिसमें प्रतिबंध के आधार पर विवाद किया जाता है और पुनः जांच का अनुरोध किया जाता है. प्रतिबंध का कारण सूचित होने के बाद ग्राहक सहायता चैनल के माध्यम से आपत्ति दर्ज की जा सकती है. दिए गए कारणों और साक्ष्यों की जांच के परिणाम के आधार पर उपाय बनाए रखने या हटाने का निर्णय होता है."
long: |-
  आपत्ति एक ऐसी प्रक्रिया है जिसमें प्रतिबंध या भुगतान उपाय के कारण को अनुचित बताकर विवाद किया जाता है और नया निर्णय मांगा जाता है. प्रतिबंध का कारण और आधार सूचित होने के बाद निर्धारित अवधि के भीतर आपत्ति दर्ज की जा सकती है. दर्ज की गई आपत्ति रिकॉर्ड के रूप में रहती है. उपाय को बनाए रखना है या हटाना है यह जांच के परिणाम पर निर्भर करता है.

  आपत्ति दर्ज करने पर भी कारण जांचने और भुगतान इतिहास देखने के रास्ते बने रहते हैं. यदि कोई तत्काल सुरक्षा या कानूनी कारण नहीं है तो प्रतिबंध से पहले कारण सूचित किया जाता है. आपत्ति प्रक्रिया के दौरान पहचान सत्यापन और आवश्यक साक्ष्य मांगे जा सकते हैं. अनुरोध का दायरा कानून और सुरक्षा द्वारा अनुमत सीमा के भीतर तय होता है.

  यदि आपत्ति स्वीकार कर ली जाती है तो प्रतिबंध हटाया या हल्का किया जा सकता है. यदि स्वीकार नहीं की जाती तो मौजूदा उपाय बना रहता है. परिणाम सेवा स्क्रीन, सूचना या ईमेल के माध्यम से बताया जाता है. समग्र प्रक्रिया और प्रसंस्करण समय सीमा सेवा नियम, ग्राहक सहायता मार्गदर्शन और लागू कानून द्वारा मिलकर तय की जाती है.
