short: "वापसी वह प्रणाली है जो अनुबंध करने के बाद निर्धारित अवधि के भीतर अनुबंध वापस लेने की अनुमति देती है. सेवा में यह तब आधार बनती है जब सशुल्क Lemons देने की शर्तें अनुबंध से भिन्न रूप में पूरी होती हैं. विशिष्ट अवधि और प्रक्रिया धनवापसी नीति में तय किए गए मानदंडों का पालन करती है."
long: |-
  वापसी उपभोक्ता का वह अधिकार है जिससे अनुबंध करने के बाद निर्धारित अवधि के भीतर अनुबंध को प्रभावहीन किया जा सकता है. जब प्रदर्शन, विज्ञापन या अनुबंध की सामग्री वास्तव में दी गई सामग्री से भिन्न होती है तो इसे निर्णय मानदंड के रूप में उपयोग किया जाता है. कानून और नियमों द्वारा निर्धारित अवधि के भीतर वापसी का अनुरोध करने पर उसका प्रभाव मान्य होता है. वापसी स्वीकार होने पर उस अनुबंध की राशि लौटाई जाती है.

  सेवा में वापसी तब मुद्दा बनती है जब Lemons का दिया जाना या सेवा की पूर्ति अनुबंध की सामग्री से भिन्न होती है. डुप्लिकेट भुगतान या कंपनी की गलती के कारण हुई गलत वसूली भी सुधार के दायरे में आती है. वापसी का कारण स्वीकार होगा या नहीं यह भुगतान के समय के अनुबंध और वास्तविक पूर्ति की तुलना करके तय किया जाता है. निर्णय मानदंड और आवश्यक साक्ष्य धनवापसी नीति में विस्तार से बताए जाते हैं.

  जब वापसी स्वीकार होती है तो उस भुगतान से दिए गए Lemons और लाभ वापस लेने के दायरे में आते हैं. यदि कुछ Lemons उपयोग हो चुके हैं तो उपयोग की गई मात्रा को छोड़कर निपटान होता है. अंतिम धनवापसी राशि और वापसी विवरण अनुरोध की पुष्टि से पहले देखे जा सकते हैं. समग्र वापसी प्रक्रिया और प्रसंस्करण समय सीमा लागू कानून, नियम और धनवापसी नीति द्वारा मिलकर तय होती है.
