short: "प्रतिबंध एक ऐसा उपाय है जो नियमों के उल्लंघन या सुरक्षा जोखिम होने पर सेवा के उपयोग को रोकता है. इसका दायरा कुछ सुविधाओं को सीमित करने से लेकर पूरे खाते को प्रतिबंधित करने तक हो सकता है. तत्काल सुरक्षा या कानूनी जोखिम तुरंत प्रतिबंध का कारण बन सकता है."
long: |-
  प्रतिबंध एक ऐसा उपाय है जो नियमों के उल्लंघन या सुरक्षा और भुगतान धोखाधड़ी के जोखिम की पुष्टि होने पर सेवा के उपयोग को सीमित करता है. उल्लंघन की गंभीरता और दायरे के अनुसार केवल कुछ सुविधाएं सीमित हो सकती हैं. अधिक गंभीर मामलों में पूरा खाता प्रतिबंधित हो सकता है. प्रतिबंध का कारण और दायरा प्रतिबंध से पहले या लागू होने के समय सूचित किया जाता है.

  यदि कोई तत्काल सुरक्षा या कानूनी कारण नहीं है तो प्रतिबंध का कारण पहले से सूचित किया जाता है और आपत्ति करने का अवसर दिया जाता है. खाता प्रतिबंधित होने पर भी कारण जांचने और भुगतान इतिहास देखने के रास्ते बने रहते हैं. आपत्ति निर्धारित अवधि के भीतर ग्राहक सहायता चैनल के माध्यम से दर्ज की जा सकती है. प्रतिबंध हटाया जाएगा या नहीं यह पुनः जांच के परिणाम और भुगतान स्थिति के आधार पर तय होता है.

  खाता प्रतिबंध अनुबंध समाप्ति से अलग है. अस्थायी प्रतिबंध शर्तें पूरी होने पर फिर से हटाया जा सकता है. अनुबंध समाप्ति खाता बंद होने या सेवा से बाहर जाने की ओर ले जाती है. शेष खरीदे गए Lemons और सशुल्क अधिकार कानून और नीतियों के अनुसार निपटाए या वापस किए जाते हैं और बिना सूचना के थोक में समाप्त नहीं किए जाते.
