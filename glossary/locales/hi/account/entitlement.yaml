short: "उपयोग अधिकार खाते की वह अनुमति है जिससे कोई विशिष्ट उत्पाद या सशुल्क सुविधा उपयोग की जा सकती है. केवल खाता बनाने से सभी अधिकार स्वतः नहीं मिलते. वास्तविक अधिकार आयु, निवास देश, भुगतान माध्यम और उत्पाद की शर्तों के अनुसार भिन्न होते हैं."
long: |-
  उपयोग अधिकार वह अनुमति है जो एक खाता कई उत्पादों में लॉग इन करने पर भी प्रत्येक सेवा पर अलग-अलग लागू होती है. केवल खाता बनाने का तथ्य सभी उत्पादों या सशुल्क सुविधाओं पर अधिकार नहीं देता. वास्तविक अधिकार प्रत्येक उत्पाद की नीति और उपलब्धता के अनुसार तय होते हैं. अधिकार है या नहीं यह लॉग इन के बाद प्रत्येक उत्पाद की स्क्रीन पर देखा जा सकता है.

  उपयोग अधिकार खाते की स्थिति और लॉग इन माध्यम के साथ मिलकर प्रबंधित होता है. खाते की जानकारी अद्यतन रखने से अधिकार का निर्णय सटीक होता है. खाता या लॉग इन माध्यम दूसरों को उधार देना या बेचना स्वीकार्य नहीं है. आवश्यक अधिकार के बिना सुविधा उपयोग करने का प्रयास करने पर पहुंच सीमित हो सकती है.

  कुछ अधिकार आयु, निवास देश, भुगतान माध्यम या उत्पाद की विशेषताओं के अनुसार अतिरिक्त रूप से सीमित होते हैं. सीमित अधिकार शर्तें पूरी होने पर फिर से दिए जा सकते हैं. शर्तें पूरी हुईं या नहीं यह सेवा स्क्रीन पर बताए गए मानदंडों से तय होता है. अधिकार देने और सीमित करने के समग्र मानदंड सेवा नियम और प्रत्येक उत्पाद के मार्गदर्शन में तय होते हैं.
