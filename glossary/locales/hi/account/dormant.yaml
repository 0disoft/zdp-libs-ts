short: "निष्क्रिय स्थिति वह खाता स्थिति है जिसमें एक निश्चित अवधि तक लॉगिन या सेवा उपयोग नहीं होता है. खरीदे गए लेमन केवल खाता निष्क्रिय होने के कारण नहीं हटाए जाते. खाता दोबारा उपयोग करने पर खरीदे गए लेमन के अधिकार बने रहते हैं."
long: |-
  निष्क्रिय स्थिति का अर्थ है कि खाता एक निश्चित अवधि तक लॉगिन या सेवा उपयोग के बिना निष्क्रिय हो गया है. निष्क्रिय होने पर भी खाता जानकारी और खरीदे गए लेमन संरक्षित रहते हैं. खरीदे गए लेमन की वैधता निष्क्रियता के बावजूद समान रूप से लागू होती है. दोबारा लॉगिन करने पर निष्क्रिय स्थिति समाप्त हो जाती है.

  निष्क्रिय स्थिति खाता बंद करने या सेवा समाप्ति से भिन्न है. खाता बंद करने या सेवा समाप्ति पर शेष लेमन के रिफंड और स्थानांतरण चरण पहले से बताए जाते हैं. निष्क्रियता के कारण बिना सूचना के खरीदे गए लेमन कभी नहीं हटाए जाते. सटीक निष्क्रिय अवधि प्रत्येक उत्पाद गाइड में दिखाई जाती है.

  लंबी निष्क्रियता के बाद भी खरीदे गए लेमन का स्वामित्व बना रहता है. निष्क्रिय अवस्था में केवल वैधता अवधि वाले लेमन ही समाप्त हो सकते हैं. समाप्ति की स्थिति और समय शेष राशि स्क्रीन पर देखे जा सकते हैं. प्रश्न सहायता चैनल के माध्यम से पूछे जा सकते हैं.
