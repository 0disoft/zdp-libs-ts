short: "การอุทธรณ์ คือ กระบวนการโต้แย้งเหตุผลของการจำกัด และขอให้ตรวจสอบใหม่. หลังจากแจ้งเหตุผลของการจำกัดแล้ว สามารถยื่นอุทธรณ์ผ่านช่องทางสนับสนุนลูกค้า. ตามผลการตรวจสอบเหตุผล และหลักฐานที่ยื่น จะตัดสินใจคงไว้ หรือยกเลิกมาตรการ."
long: |-
  การอุทธรณ์ คือ กระบวนการโต้แย้งเหตุผลของการจำกัด หรือมาตรการการชำระเงิน และขอให้ตัดสินใจใหม่. หลังจากแจ้งเหตุผล และพื้นฐานของการจำกัดแล้ว สามารถยื่นอุทธรณ์ได้ภายในระยะเวลาที่กำหนด. การอุทธรณ์ที่ยื่น จะถูกเก็บเป็นบันทึก. การคงไว้ หรือยกเลิกมาตรการ ขึ้นอยู่กับผลการตรวจสอบ.

  แม้จะยื่นอุทธรณ์ ช่องทางตรวจสอบเหตุผล และประวัติการชำระเงินยังคงมีอยู่. หากไม่มีเหตุผลด้านความปลอดภัย หรือกฎหมายที่เร่งด่วน จะแจ้งเหตุผลก่อนการจำกัด. ในระหว่างกระบวนการอุทธรณ์ อาจมีการขอตรวจสอบตัวตน และหลักฐานที่จำเป็น. ขอบเขตของการขอ กำหนดภายในขอบเขตที่กฎหมาย และความปลอดภัยอนุญาต.

  หากการอุทธรณ์ได้รับการยอมรับ การจำกัดอาจถูกยกเลิก หรือผ่อนคลาย. หากไม่ได้รับการยอมรับ มาตรการเดิมจะยังคงอยู่. ผลลัพธ์จะแจ้งผ่านหน้าจอบริการ การแจ้งเตือน หรืออีเมล. ขั้นตอนโดยรวม และระยะเวลาการดำเนินการ กำหนดร่วมกันโดยข้อกำหนดการให้บริการ คู่มือสนับสนุนลูกค้า และกฎหมายที่เกี่ยวข้อง.
