short: "การถอน คือ ระบบที่อนุญาตให้ถอนสัญญา ภายในระยะเวลาที่กำหนด หลังจากทำสัญญา. ในบริการ การถอนเป็นพื้นฐาน เมื่อเงื่อนไขการให้ Lemon แบบชำระเงิน ถูกดำเนินการแตกต่างจากสัญญา. ระยะเวลา และขั้นตอนที่ชัดเจน เป็นไปตามเกณฑ์ที่กำหนดในนโยบายการคืนเงิน."
long: |-
  การถอน คือ สิทธิ์ของผู้บริโภค ในการทำให้สัญญาไม่มีผล ภายในระยะเวลาที่กำหนด หลังจากทำสัญญา. ใช้เป็นเกณฑ์การประเมิน เมื่อเนื้อหาที่แสดง โฆษณา หรือสัญญา แตกต่างจากสิ่งที่ให้จริง. หากยื่นคำขอ ภายในระยะเวลาที่กฎหมาย และข้อกำหนดกำหนด ผลจะมีผลบังคับ. เมื่อการถอนได้รับการยอมรับ จำนวนเงินของสัญญานั้น จะถูกคืน.

  ในบริการ การถอนกลายเป็นประเด็น เมื่อการให้ Lemon หรือการให้บริการ แตกต่างจากเนื้อหาของสัญญา. การชำระเงินซ้ำซ้อน หรือการให้ที่ผิดพลาดจากความผิดของบริษัท ก็เป็นวัตถุของการแก้ไข. การยอมรับเหตุผลการถอน หรือไม่ ถูกประเมินโดยเปรียบเทียบสัญญา ณ เวลาชำระเงิน กับการดำเนินการจริง. เกณฑ์การประเมิน และหลักฐานที่จำเป็น แจ้งอย่างชัดเจนในนโยบายการคืนเงิน.

  เมื่อการถอนได้รับการยอมรับ Lemon และสิทธิประโยชน์ ที่ให้จากการชำระเงินนั้น จะเป็นวัตถุของการเรียกคืน. หากมี Lemon ที่ใช้แล้ว ส่วนที่ใช้แล้ว จะถูกแยกออกจากการชำระบัญชี. จำนวนเงินคืนสุดท้าย และรายละเอียดการเรียกคืน สามารถตรวจสอบได้ก่อนยืนยันคำขอ. ขั้นตอนการถอนโดยรวม และระยะเวลาการดำเนินการ กำหนดร่วมกันโดยกฎหมายที่เกี่ยวข้อง ข้อกำหนด และนโยบายการคืนเงิน.
