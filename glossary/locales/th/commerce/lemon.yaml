short: "Lemon คือ หน่วยเครดิตรวมที่ใช้ร่วมกันในหลายผลิตภัณฑ์. แบ่งเป็น Lemon แบบชำระเงิน ที่ให้เมื่อซื้อ และ Lemon ฟรี ที่ให้เป็นโบนัส. Lemon แบบชำระเงิน อาจเป็นวัตถุของการคืนเงิน."
long: |-
  Lemon คือ หน่วยเครดิตที่ใช้ร่วมกันในหลายผลิตภัณฑ์. แบ่งเป็น Lemon แบบชำระเงิน ที่ให้ผ่านการซื้อ และ Lemon ฟรี ที่ให้ผ่านกิจกรรม หรือรางวัล. Lemon แต่ละตัว เป็นไปตามเงื่อนไขอายุใช้งาน และการคืนเงิน ที่กำหนด ณ เวลาที่ให้. บนหน้าจอยอดเงินคงเหลือ สามารถตรวจสอบแหล่งที่มา และวันหมดอายุของ Lemon แต่ละตัวได้.

  Lemon จะถูกหัก เป็นหน่วยที่จำเป็นสำหรับการใช้บริการ. การหักจริง จะใช้กับขอบเขตของงานที่เสร็จสมบูรณ์เท่านั้น. หากงานยังไม่เริ่ม หรือไม่ได้รับผลลัพธ์ที่ถูกต้องจากความผิดของบริษัท Lemon ที่จองไว้ จะถูกกู้คืน. ประวัติการหัก สามารถตรวจสอบได้ในบันทึกการชำระเงิน และการใช้งาน.

  Lemon โบนัส อาจมีลำดับการใช้งาน ที่แตกต่างจาก Lemon แบบชำระเงิน. Lemon โบนัส จะถูกใช้ก่อน โดยเริ่มจากรายการที่อายุใช้งานสั้นที่สุด. Lemon ที่หมดอายุ จะถูกลบอัตโนมัติ และไม่ถูกกู้คืน. โดยรวม กฎการให้ การหมดอายุ และการกู้คืน Lemon เป็นไปตามเกณฑ์ที่กำหนดในนโยบายเครดิต.
