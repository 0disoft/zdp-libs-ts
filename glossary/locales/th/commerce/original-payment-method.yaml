short: "ช่องทางชำระเงินเดิม คือเครื่องมือที่ใช้จริงตอนชำระเงิน. เงินคืนโดยหลัก จะกลับไปยังช่องทางเดิมนี้. เวลาจริงอาจต่างกัน ตามผู้ให้บริการชำระเงิน."
long: |-
  ช่องทางชำระเงินเดิม หมายถึงบัตรหรือบัญชี ที่ผู้ใช้ชำระเงินจริง. เมื่อคำขอคืนเงินได้รับการยืนยัน จำนวนเงินที่เหลือ จะถูกส่งคืนผ่านช่องทางนี้โดยหลัก. อาจต้องใช้เวลาเพิ่มเติม ตามกำหนดการประมวลผลของผู้ให้บริการชำระเงิน. สถานะการดำเนินการ ดูได้จากบันทึกการชำระเงินและการใช้งาน.

  หากการคืนเงินบางส่วน เป็นไปไม่ได้ในเชิงโครงสร้างผ่านช่องทางเดิม จะเสนอทางเลือก. วิธีการทางเลือก และจำนวนเงินสุดท้ายจะประกาศก่อนยืนยัน. การคืนเงินแทน จะดำเนินการหลังผู้ใช้ยินยอมเท่านั้น. หากไม่ยินยอม เกณฑ์ช่องทางเดิมยังคงมีผล.

  จำนวนเงินและวิธีการคืนเงิน แสดงอย่างโปร่งใสระหว่างขั้นตอนการขอ. เลมอนโบนัสและสิทธิประโยชน์ ที่ถูกเรียกคืน ก็แสดงบนหน้าจอเดียวกัน. รายละเอียดการชำระบัญชีสุดท้าย จะเผยแพร่อีกครั้งก่อนยืนยัน. เกณฑ์ที่เกี่ยวข้อง กำหนดโดยนโยบายการคืนเงินและเครดิต.
