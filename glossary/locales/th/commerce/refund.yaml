short: "การคืนเงิน คือ การดำเนินการคืนเงิน เมื่อการให้บริการแตกต่างจากสัญญา หรือมีการยืนยันการชำระเงินซ้ำซ้อน. Lemon แบบชำระเงิน จะถูกชำระบัญชีโดยไม่รวมส่วนที่ใช้แล้ว. จำนวนเงินที่เหลือ จะถูกคืนตามนโยบายการคืนเงิน."
long: |-
  การคืนเงิน คือ การดำเนินการคืนเงิน เมื่อสัญญาที่แจ้ง ณ เวลาชำระเงิน แตกต่างจากเนื้อหาที่ให้จริง. การชำระเงินซ้ำซ้อน หรือการเรียกเก็บที่ผิดพลาดจากความผิดพลาดของระบบ ก็เป็นวัตถุของการคืนเงิน. เหตุผลของการคืนเงิน พิจารณาโดยเปรียบเทียบสัญญา ณ เวลาชำระเงิน กับ Lemon และสิทธิประโยชน์ที่ให้จริง. การยอมรับเหตุผลการคืนเงิน หรือไม่ และหลักฐานที่จำเป็น กำหนดไว้อย่างชัดเจนในนโยบายการคืนเงิน.

  เมื่อการคืนเงินได้รับการยอมรับ Lemon แบบชำระเงิน และสิทธิประโยชน์โบนัส ที่ให้จากการชำระเงินนั้น จะเป็นวัตถุของการเรียกคืน. หากใช้ Lemon ไปบางส่วน ส่วนที่ใช้แล้ว จะถูกแยกออกจากการชำระบัญชี. Lemon โบนัส อาจถูกจัดการแยกต่างหาก ตามอายุใช้งาน และเงื่อนไขการให้. รายละเอียดการชำระบัญชีสุดท้าย และจำนวนเงินที่คืน สามารถตรวจสอบได้ก่อนยืนยันคำขอ.

  ในกรณีการชำระเงินซ้ำซ้อน หรือการไม่สามารถให้ผลลัพธ์ที่ถูกต้องจากความผิดของบริษัท Lemon ที่จองไว้ จะถูกกู้คืน หรือคืนเงินเต็มจำนวน. ระยะเวลาการดำเนินการ และวิธีการคืน ตามวิธีการชำระเงิน และกฎหมายที่เกี่ยวข้อง. ขั้นตอนการคืนเงินโดยรวม กำหนดร่วมกันโดยข้อกำหนดการให้บริการ นโยบายเครดิต และนโยบายการคืนเงิน. สถานะการคืนเงิน สามารถตรวจสอบได้ในบันทึกการชำระเงิน และการใช้งาน.
