short: "การเติมเงินอัตโนมัติ คือฟีเจอร์ที่เติมจำนวนเงินที่ตั้งไว้โดยอัตโนมัติ เมื่อยอดเลมอนต่ำกว่าเกณฑ์. ผู้ใช้สามารถยกเลิกได้ทุกเมื่อ. หลังยกเลิก จะไม่มีการเติมเงินเพิ่มเติม."
long: |-
  การเติมเงินอัตโนมัติ ช่วยให้ผู้ใช้รักษายอดคงเหลือ โดยไม่ต้องเติมเงินด้วยตนเอง. เมื่อยอดต่ำกว่าเกณฑ์ที่ตั้งไว้ จำนวนเงินที่กำหนด จะถูกเรียกเก็บโดยอัตโนมัติ. ประวัติและจำนวนเงินที่เติม ดูได้ในบันทึกการชำระเงิน. การใช้การเติมเงินอัตโนมัติหรือไม่ เป็นทางเลือกของผู้ใช้เอง.

  การเติมเงินอัตโนมัติ สามารถยกเลิกได้ทุกเมื่อ ซึ่งจะหยุดเฉพาะการเติมเงินในอนาคต. การชำระเงินที่เสร็จสิ้นก่อนยกเลิก ปฏิบัติตามเกณฑ์การคืนเงินเดิม. จำนวนเงินที่เรียกเก็บผ่านการเติมเงินอัตโนมัติ ก็สามารถคืนเงินได้เหมือนการชำระเงินทั่วไป. หลังยกเลิก ผู้ใช้สามารถเติมเงินด้วยตนเอง ตามที่ต้องการ.

  หน้าจอตั้งค่าการเติมเงินอัตโนมัติ ให้เลือกยอดเกณฑ์และจำนวนเงินที่เติมได้. การเปลี่ยนแปลงการตั้งค่า และประวัติการยกเลิกแสดงในบริการ. ข้อผิดพลาดที่เกิดจากการเติมเงินอัตโนมัติ สามารถแก้ไขได้ผ่านช่องทางสนับสนุน. เกณฑ์โดยรวม กำหนดร่วมกันโดยนโยบายเครดิตและการคืนเงิน.
