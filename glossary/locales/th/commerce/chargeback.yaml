short: "Chargeback คือกระบวนการที่การชำระเงินถูกส่งคืนผ่านผู้ให้บริการชำระเงินหลังเกิดข้อโต้แย้ง. เมื่อเงินถูกเรียกคืนด้วยเหตุผลอื่นนอกเหนือจากการชำระซ้ำหรือข้อผิดพลาด สิทธิประโยชน์ที่เกี่ยวข้องก็จะถูกจัดการด้วย. การใช้การชำระเงินนั้นและฟีเจอร์แบบชำระเงินอาจถูกจำกัดจนกว่าปัญหาจะได้รับการแก้ไข."
long: |-
  Chargeback คือกระบวนการที่ผู้ออกบัตรหรือผู้ให้บริการชำระเงินเรียกคืนการชำระเงินเนื่องจากข้อโต้แย้ง. กระบวนการอาจเริ่มเมื่อผู้ชำระเงินอ้างว่าไม่ได้อนุมัติการชำระเงิน หรือเมื่อเกิดข้อโต้แย้งด้านบริการ. บริษัทตรวจสอบเหตุผลและส่งหลักฐานที่จำเป็นเพื่อตอบสนอง. ผลลัพธ์ของ Chargeback สะท้อนในสถานะการชำระเงินและบันทึกรายการ.

  เมื่อเงินถูกเรียกคืนผ่าน Chargeback เลมอนที่ซื้อและเลมอนโบนัสที่ให้จากการชำระเงินนั้นจะกลายเป็นเป้าหมายการเรียกคืน. หากเลมอนบางส่วนถูกใช้ไปแล้ว การจัดการจะครอบคลุมเฉพาะส่วนที่ใช้. การชำระเงินและฟีเจอร์แบบชำระเงินนั้นอาจยังถูกจำกัดจนกว่าปัญหาจะได้รับการแก้ไข. เหตุผลและความคืบหน้าจะประกาศให้ผู้ใช้ทราบอย่างชัดเจน.

  Chargeback แตกต่างจากการคืนเงินปกติในขั้นตอน. การคืนเงินจัดการโดยบริการก่อน ในขณะที่ Chargeback เกี่ยวข้องกับผู้ให้บริการชำระเงิน. หากไม่ยอมรับการคัดค้าน การชำระเงินจะคงอยู่และประวัติการหักยังคงเดิม. มาตรฐานโดยละเอียดดูได้จากนโยบายการคืนเงินและนโยบายเครดิต.
