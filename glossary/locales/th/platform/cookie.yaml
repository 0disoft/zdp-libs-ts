short: "คุกกี้คือไฟล์ขนาดเล็กที่เว็บไซต์เก็บไว้ในเบราว์เซอร์ของคุณ. คุกกี้จดจำการตั้งค่าการแสดงผล เช่น ภาษา ธีม และขนาดตัวอักษร. คุกกี้ที่จำเป็นสนับสนุนบริการ และคุกกี้ที่ไม่บังคับสามารถปฏิเสธได้."
long: |-
  คุกกี้คือไฟล์ข้อมูลขนาดเล็กที่เว็บไซต์ที่คุณเยี่ยมชมทิ้งไว้ในเบราว์เซอร์. คุกกี้จดจำการตั้งค่าการแสดงผล เพื่อให้การเข้าชมครั้งต่อไปแสดงสภาพแวดล้อมเดียวกัน. เป็นบันทึกการเลือกภายในเบราว์เซอร์ ไม่ใช่เอกสารยืนยันตัวตน. คุณสามารถตรวจสอบและล้างการตั้งค่าเหล่านี้ในเบราว์เซอร์ได้ทุกเมื่อ.

  คุกกี้ที่จำเป็นทำหน้าที่ขั้นต่ำที่บริการต้องใช้เพื่อทำงานอย่างถูกต้อง. คุกกี้ที่ไม่บังคับอาจใช้สำหรับส่วนเสริม เช่น โฆษณาหรือการวิเคราะห์. คุกกี้ที่ไม่บังคับสามารถปฏิเสธได้ผ่านการจัดการความยินยอมหรือการตั้งค่าเบราว์เซอร์. การปฏิเสธไม่จำกัดการใช้บริการพื้นฐาน.

  นโยบายความเป็นส่วนตัวเปิดเผยอย่างโปร่งใสว่าคุกกี้ใดใช้เพื่อวัตถุประสงค์ใด. เมื่อเครื่องมือภายนอกใช้คุกกี้ ผู้ให้บริการและวัตถุประสงค์จะประกาศพร้อมกัน. คุณสามารถเปลี่ยนการตั้งค่าคุกกี้ได้ทุกเมื่อหลังการเยี่ยมชม. การล้างคุกกี้ทั้งหมดในเบราว์เซอร์ไม่ได้ลบบัญชีของคุณ.
