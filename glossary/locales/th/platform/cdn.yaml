short: "CDN คือเครือข่ายที่จัดเก็บไฟล์บนเซิร์ฟเวอร์หลายแห่ง และส่งมอบอย่างรวดเร็วจากตำแหน่งที่ใกล้ที่สุด. CDN ให้บริการไฟล์ที่ใช้ร่วมกัน เช่น แบบอักษรและสคริปต์ของเว็บไซต์. ที่อยู่ IP การเข้าถึงอาจถูกส่งไปยังผู้ให้บริการ CDN ระหว่างการร้องขอ."
long: |-
  CDN ย่อมาจาก Content Delivery Network และทำงานโดยคัดลอกไฟล์ไปยังเซิร์ฟเวอร์ในหลายภูมิภาค แล้วส่งมอบจากเซิร์ฟเวอร์ที่ใกล้คุณที่สุด. ใช้สำหรับส่งมอบไฟล์ที่ใช้ร่วมกัน เช่น แบบอักษร สคริปต์ และรูปภาพอย่างรวดเร็วและเชื่อถือได้. คำขอถูกจัดการกระจายไปยังเซิร์ฟเวอร์ภูมิภาคแทนที่จะโหลดเซิร์ฟเวอร์เดียว. ความเร็วในการโหลดหน้าที่รับรู้ก็ดีขึ้นเช่นกัน.

  เว็บไซต์นี้ใช้ jsDelivr CDN เพื่อส่งมอบแบบอักษร. การเปิดหน้าสร้างคำขอไปยังเซิร์ฟเวอร์ CDN เพื่อรับไฟล์. คำขออาจส่งที่อยู่ IP การเข้าถึงและข้อมูลพื้นฐานของเบราว์เซอร์ของคุณไปยังผู้ให้บริการ CDN. ข้อมูลที่ส่งเป็นขั้นต่ำที่จำเป็นสำหรับการส่งมอบไฟล์.

  นโยบายความเป็นส่วนตัวเปิดเผยการใช้ CDN และข้อมูลที่ประมวลผลอย่างโปร่งใส. รายละเอียดยังมีอยู่ในประกาศผู้ประมวลผลย่อยของผู้ให้บริการ CDN. CDN คือโครงสร้างพื้นฐานที่ทำให้เส้นทางการส่งมอบเร็วขึ้น ไม่ใช่เครื่องมือที่จัดเก็บหรือวิเคราะห์เนื้อหา. อาจเพิ่ม CDN หรือผู้ให้บริการโฮสติ้งเพิ่มเติมเมื่อบริการเติบโต และจะประกาศล่วงหน้า.
