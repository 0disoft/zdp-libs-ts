short: "การจำกัด คือ มาตรการที่ป้องกันการใช้บริการ เมื่อมีการละเมิดข้อกำหนด หรือมีความเสี่ยงด้านความปลอดภัย. ขอบเขตอาจตั้งแต่การจำกัดบางฟังก์ชัน ไปจนถึงการจำกัดทั้งบัญชี. ความเสี่ยงด้านความปลอดภัย หรือกฎหมายที่เร่งด่วน อาจเป็นเหตุให้จำกัดได้ทันที."
long: |-
  การจำกัด คือ มาตรการที่จำกัดการใช้บริการ เมื่อมีการยืนยันการละเมิดข้อกำหนด หรือความเสี่ยงด้านการฉ้อโกงความปลอดภัยและการชำระเงิน. ตามระดับและขอบเขตของการละเมิด อาจจำกัดเพียงบางฟังก์ชัน. ในกรณีที่ร้ายแรงกว่า อาจจำกัดทั้งบัญชี. เหตุผลและขอบเขตของการจำกัด จะแจ้งก่อน หรือในเวลาที่ดำเนินการ.

  หากไม่มีเหตุผลด้านความปลอดภัย หรือกฎหมายที่เร่งด่วน จะแจ้งเหตุผลของการจำกัดล่วงหน้า และให้โอกาสในการอุทธรณ์. แม้บัญชีจะถูกจำกัด ช่องทางตรวจสอบเหตุผล และประวัติการชำระเงินยังคงมีอยู่. การอุทธรณ์สามารถยื่นผ่านช่องทางสนับสนุนลูกค้า ภายในระยะเวลาที่กำหนด. การจะยกเลิกการจำกัดหรือไม่ ขึ้นอยู่กับผลการตรวจสอบซ้ำ และสถานะการชำระเงิน.

  การจำกัดบัญชี แตกต่างจากการยกเลิกสัญญา. การจำกัดชั่วคราวสามารถยกเลิกได้ เมื่อเงื่อนไขได้รับการแก้ไข. การยกเลิกสัญญา นำไปสู่การปิดบัญชี หรือการสิ้นสุดบริการ. Lemon ที่ซื้อที่เหลือ และสิทธิ์แบบชำระเงิน จะถูกชำระบัญชี หรือคืนเงินตามกฎหมายและนโยบาย และจะไม่ถูกลบทั้งก้อนโดยไม่แจ้งให้ทราบ.
