short: "สถานะไม่ใช้งาน คือสถานะบัญชีที่ไม่มีการเข้าสู่ระบบ หรือใช้งานบริการเป็นระยะเวลาหนึ่ง. เลมอนที่ซื้อจะไม่ถูกลบ เพียงเพราะบัญชีไม่ใช้งาน. เมื่อใช้บัญชีอีกครั้ง สิทธิในเลมอนที่ซื้อจะยังคงเดิม."
long: |-
  สถานะไม่ใช้งาน หมายความว่าบัญชีกลายเป็นสถานะพัก เนื่องจากไม่เข้าสู่ระบบ หรือไม่ใช้งานบริการเป็นระยะเวลาหนึ่ง. แม้บัญชีไม่ใช้งาน ข้อมูลบัญชีและเลมอนที่ซื้อจะยังคงถูกเก็บไว้. อายุของเลมอนที่ซื้อใช้เหมือนกัน ไม่ว่าบัญชีจะไม่ใช้งานหรือไม่. การเข้าสู่ระบบอีกครั้ง จะสิ้นสุดสถานะไม่ใช้งาน.

  สถานะไม่ใช้งาน แตกต่างจากการปิดบัญชี หรือการยุติบริการ. เมื่อปิดบัญชีหรือยุติบริการ จะแจ้งขั้นตอนการคืนเงิน และการโอนเลมอนที่เหลือล่วงหน้า. การไม่ใช้งานเพียงอย่างเดียว ไม่เคยลบเลมอนที่ซื้อ โดยไม่แจ้งให้ทราบ. ระยะเวลาไม่ใช้งานที่แน่นอน จะแสดงในคำแนะนำแต่ละผลิตภัณฑ์.

  ความเป็นเจ้าของเลมอนที่ซื้อ ยังคงอยู่แม้หลังจากไม่ใช้งานเป็นเวลานาน. เฉพาะเลมอนที่มีอายุเท่านั้น ที่อาจหมดอายุระหว่างไม่ใช้งาน. สถานะและกำหนดการหมดอายุ เห็นได้บนหน้าจอยอดคงเหลือ. คำถามสามารถสอบถาม ผ่านช่องทางสนับสนุนได้.
