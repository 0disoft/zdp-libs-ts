short: "สิทธิ์การใช้ คือ การอนุญาตของบัญชี ในการใช้ผลิตภัณฑ์เฉพาะ หรือฟังก์ชันแบบชำระเงิน. การสร้างบัญชีเพียงอย่างเดียว ไม่ได้ให้สิทธิ์ทั้งหมดโดยอัตโนมัติ. สิทธิ์จริง แตกต่างกันตามอายุ ประเทศที่อยู่ วิธีการชำระเงิน และเงื่อนไขของผลิตภัณฑ์."
long: |-
  สิทธิ์การใช้ คือ การอนุญาตที่ใช้แตกต่างกันในแต่ละบริการ แม้บัญชีเดียวจะเข้าสู่ระบบหลายผลิตภัณฑ์. การสร้างบัญชีเพียงอย่างเดียว ไม่ก่อให้เกิดสิทธิ์ในทุกผลิตภัณฑ์ หรือฟังก์ชันแบบชำระเงิน. สิทธิ์จริง กำหนดตามนโยบาย และสถานะการให้บริการของแต่ละผลิตภัณฑ์. การมีหรือไม่มีสิทธิ์ สามารถตรวจสอบได้บนหน้าจอของแต่ละผลิตภัณฑ์ หลังจากเข้าสู่ระบบ.

  สิทธิ์การใช้ ถูกจัดการร่วมกับสถานะของบัญชี และวิธีการเข้าสู่ระบบ. การรักษาข้อมูลบัญชีให้เป็นปัจจุบัน ทำให้การประเมินสิทธิ์แม่นยำ. การให้ยืม หรือขายบัญชี หรือวิธีการเข้าสู่ระบบ ให้ผู้อื่น ไม่ได้รับอนุญาต. การพยายามใช้ฟังก์ชัน โดยไม่มีสิทธิ์ที่จำเป็น อาจนำไปสู่การจำกัดการเข้าถึง.

  สิทธิ์บางส่วน ถูกจำกัดเพิ่มเติมโดยอายุ ประเทศที่อยู่ วิธีการชำระเงิน หรือลักษณะของผลิตภัณฑ์. สิทธิ์ที่ถูกจำกัด สามารถถูกให้ใหม่ได้ เมื่อเงื่อนไขได้รับการปฏิบัติตาม. การปฏิบัติตามเงื่อนไข หรือไม่ ถูกประเมินตามเกณฑ์ที่แจ้งบนหน้าจอบริการ. เกณฑ์โดยรวมของการให้ และการจำกัดสิทธิ์ กำหนดโดยข้อกำหนดการให้บริการ และคู่มือของแต่ละผลิตภัณฑ์.
