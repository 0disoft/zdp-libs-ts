short: "Token คือใบรับรองการเข้าถึงที่แสดงสถานะการเชื่อมต่อกับบัญชีภายนอก. Token อนุญาตเฉพาะขอบเขตที่จำกัด แทนการเข้าถึงเต็มรูปแบบด้วยรหัสผ่าน. Token ที่เก็บไว้จะถูกลบเมื่อถอนการเชื่อมต่อ."
long: |-
  Token คือใบรับรองการเข้าถึงที่ออกเมื่อคุณอนุญาตการเชื่อมต่อบริการภายนอก. แทนที่จะให้สิทธิ์เต็มรูปแบบเหมือนรหัสผ่าน Token อนุญาตเฉพาะขอบเขตที่ได้รับอนุญาต. บริการภายนอกใช้ Token นี้เพื่อทำงานจำกัดในนามของคุณ. Token ไม่ใช่รหัสผ่าน และสามารถออกใหม่ได้เมื่อจำเป็น.

  Token ที่เก็บไว้ใช้เฉพาะการเรียกใช้ฟีเจอร์ที่เชื่อมต่อ. สถานการณ์ที่ต้องเข้าถึง Token จะถูกบันทึกพร้อมเหตุผลและขอบเขต. เมื่อคุณตัดการเชื่อมต่อ การเข้าถึงใหม่จะหยุดทันที. หลังการตัดการเชื่อมต่อ จะดำเนินการลบ Token ที่เก็บไว้และข้อมูลแคช.

  นโยบายความเป็นส่วนตัวเปิดเผยอย่างโปร่งใสว่า Token ถูกรวบรวม จัดเก็บ และลบอย่างไร. Token ถูกเก็บแยกและปลอดภัยจากข้อมูลทั่วไป. Token สามารถเพิกถอนและออกใหม่ได้เมื่อตรวจพบการเข้าถึงที่น่าสงสัย. คุณสามารถตรวจสอบและถอนสิทธิ์ได้ทุกเมื่อจากรายการการเชื่อมต่อ.
