short: "การปกปิดคือวิธีการประมวลผลที่แสดงข้อมูลส่วนบุคคลโดยซ่อนบางส่วนไว้. เจ้าหน้าที่ปฏิบัติการเห็นเฉพาะข้อมูลที่ถูกปกปิดเป็นค่าเริ่มต้น. การเข้าถึงเนื้อหาต้นฉบับจะให้เฉพาะเมื่อมีการบันทึกเหตุผลและขอบเขต."
long: |-
  การปกปิดคือวิธีการแสดงข้อมูลส่วนบุคคล เช่น ชื่อหรือรายละเอียดบัญชี โดยบางส่วนถูกแทนที่ด้วยสัญลักษณ์. วิธีนี้ทำให้มองเห็นเฉพาะข้อมูลขั้นต่ำที่จำเป็นสำหรับการทำงาน. ในระบบที่จัดการข้อมูลส่วนบุคคล การปกปิดถูกใช้เป็นหลักการพื้นฐาน. เจ้าหน้าที่ปฏิบัติการและฝ่ายสนับสนุนเห็นเฉพาะข้อมูลที่ถูกปกปิดเป็นค่าเริ่มต้น.

  งานบางอย่างต้องใช้เนื้อหาผู้ใช้ต้นฉบับหรือ Token บัญชีภายนอกที่ไม่สามารถปกปิดได้. ในกรณีพิเศษเหล่านี้ เหตุผล ขอบเขต และเวลาหมดอายุจะถูกบันทึก. บันทึกการเข้าถึงยังคงอยู่เป็นบันทึกการตรวจสอบเพื่อทบทวนภายหลัง. การเข้าถึงพิเศษจำกัดเฉพาะเจ้าหน้าที่ขั้นต่ำที่จำเป็น.

  การปกปิดเป็นวิธีจำกัดการแสดงผล ไม่ใช่การลบข้อมูล. ข้อมูลต้นฉบับที่เก็บไว้จะรักษาตามมาตรฐานความปลอดภัยที่จำเป็น. ผู้ใช้สามารถสอบถามว่าข้อมูลของตนถูกประมวลผลอย่างไรได้ทุกเมื่อ. มาตรฐานการปกปิดดำเนินการตามนโยบายความเป็นส่วนตัว.
