short: "บันทึกการตรวจสอบคือบันทึกความปลอดภัยว่าใครเข้าถึงข้อมูลใดเมื่อใด. การเข้าถึงพิเศษจะถูกบันทึกพร้อมเหตุผล ขอบเขต และการหมดอายุ. เหตุการณ์ด้านความปลอดภัยจะถูกตรวจสอบผ่านบันทึกเหล่านี้."
long: |-
  บันทึกการตรวจสอบคือบันทึกตามลำดับเวลาของการเข้าถึงและการเปลี่ยนแปลงหลักในระบบ. ช่วยยืนยันได้ว่าใครเข้าถึงข้อมูลใด เมื่อใด และเพื่อวัตถุประสงค์ใด. บันทึกการทำงานปกติก็รวมอยู่ด้วยและเกิดขึ้นภายในขอบเขตอำนาจที่ได้รับอนุญาตเท่านั้น. บันทึกได้รับการปกป้องให้ยากต่อการปลอมแปลงหรือลบ.

  การเข้าถึงพิเศษไปยังเนื้อหาส่วนบุคคลต้นฉบับหรือ Token บัญชีภายนอกจะถูกบันทึกในบันทึกการตรวจสอบเสมอ. เหตุผล ขอบเขต และเวลาหมดอายุถูกบันทึกพร้อมกันเพื่อความโปร่งใส. เมื่อสงสัยเหตุการณ์ด้านความปลอดภัยหรือการใช้โดยฉ้อโกง บันทึกเหล่านี้ใช้สืบหาสาเหตุ. การเข้าถึงบันทึกเองก็ถูกจำกัดแยกต่างหาก.

  บันทึกการตรวจสอบคือกลไกพื้นฐานสำหรับจัดการข้อมูลส่วนบุคคลอย่างปลอดภัย. นโยบายความเป็นส่วนตัวเปิดเผยมาตรฐานการดำเนินการบันทึกการตรวจสอบ. การเข้าถึงข้อมูลผู้ใช้ถูกเก็บให้น้อยที่สุดและบันทึกเสมอ. บันทึกที่ไม่จำเป็นอีกต่อไปจะถูกลบตามระยะเวลาการเก็บรักษาที่กำหนด.
