short: "คีย์ API คือข้อมูลรับรองการยืนยันตัวตนที่โปรแกรมใช้เรียกฟีเจอร์ของบริการ. ต้องปฏิบัติต่อคีย์ API เหมือนรหัสผ่าน และไม่ควรเปิดเผยต่อสาธารณะ. การส่งคีย์ API ให้ฝ่ายสนับสนุนอาจทำให้ผู้อื่นใช้บัญชีของคุณในทางที่ผิด."
long: |-
  คีย์ API คือสตริงลับที่โปรแกรมหรือเครื่องมือใช้เรียกฟีเจอร์ของบริการอย่างปลอดภัย. คีย์นี้พิสูจน์ว่าผู้เรียกได้รับอนุญาตให้ทำงานแทนผู้ใช้. หากคีย์ API ถูกเปิดเผย ผู้อื่นสามารถใช้บริการด้วยสิทธิ์นั้นได้. ดังนั้นจึงต้องปกป้องคีย์ในระดับเดียวกับรหัสผ่าน.

  อย่าใส่คีย์ API ในการสอบถามฝ่ายสนับสนุน. เนื้อหาการสอบถามอาจผ่านเจ้าหน้าที่หลายคน จึงควบคุมขอบเขตการแบ่งปันได้ยาก. ข้อมูลรับรองอื่น เช่น Token OAuth รหัสกู้คืน และคีย์ส่วนตัว ก็ไม่ควรส่งไปด้วย. เมื่อจำเป็น จะประกาศช่องทางรวบรวมที่ปลอดภัยแยกต่างหาก.

  หากคุณเชื่อว่าคีย์ API ถูกเปิดเผย ให้เปลี่ยนเป็นคีย์ใหม่ทันที. คุณสามารถออกใหม่หรือเพิกถอนคีย์ได้ทุกเมื่อ. บริษัทไม่เคยขอคีย์ผ่านช่องทางสนับสนุน. มาตรฐานการจัดการคีย์ดูได้จากคำแนะนำด้านความปลอดภัยของแต่ละผลิตภัณฑ์.
