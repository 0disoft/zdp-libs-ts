short: "Penarikan adalah sistem yang memungkinkan penarikan kontrak dalam jangka waktu tertentu setelah kontrak dibuat. Dalam layanan, penarikan menjadi dasar ketika ketentuan pemberian Lemon berbayar dilaksanakan berbeda dari kontrak. Jangka waktu dan prosedur yang konkret mengikuti kriteria yang ditetapkan dalam kebijakan pengembalian dana."
long: |-
  Penarikan adalah hak konsumen untuk menjadikan kontrak tidak berlaku dalam jangka waktu tertentu setelah membuat kontrak. Penarikan digunakan sebagai kriteria penilaian ketika tampilan, iklan, atau isi kontrak berbeda dari apa yang benar-benar diberikan. Jika permintaan diajukan dalam jangka waktu yang ditetapkan hukum dan ketentuan, efeknya diakui. Ketika penarikan diakui, uang untuk kontrak tersebut dikembalikan.

  Dalam layanan, penarikan menjadi persoalan ketika pemberian Lemon atau penyediaan layanan berbeda dari isi kontrak. Pembayaran ganda atau pemberian yang salah akibat kesalahan perusahaan juga menjadi objek koreksi. Diakui tidaknya alasan penarikan dinilai dengan membandingkan kontrak saat pembayaran dengan pelaksanaan yang sebenarnya. Kriteria penilaian dan bukti yang diperlukan diberitahukan secara rinci dalam kebijakan pengembalian dana.

  Ketika penarikan diakui, Lemon dan manfaat yang diberikan oleh pembayaran tersebut menjadi objek penarikan kembali. Jika ada Lemon yang sudah digunakan, bagian yang digunakan dikecualikan dari penyelesaian. Jumlah pengembalian dana akhir dan rincian penarikan kembali dapat diperiksa sebelum permintaan dikonfirmasi. Prosedur penarikan secara keseluruhan dan tenggat pemrosesan ditetapkan bersama oleh hukum yang berlaku, ketentuan, dan kebijakan pengembalian dana.
