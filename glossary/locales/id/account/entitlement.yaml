short: "Hak penggunaan adalah wewenang akun untuk menggunakan produk tertentu atau fitur berbayar. Membuat akun saja tidak otomatis memberikan semua hak. Hak yang sebenarnya berbeda-beda tergantung usia, negara tempat tinggal, alat pembayaran, dan ketentuan produk."
long: |-
  Hak penggunaan adalah wewenang yang diterapkan berbeda pada setiap layanan meskipun satu akun masuk ke berbagai produk. Fakta membuat akun saja tidak menimbulkan hak atas semua produk atau fitur berbayar. Hak yang sebenarnya ditentukan berdasarkan kebijakan dan ketersediaan setiap produk. Ada tidaknya hak dapat diperiksa di layar setiap produk setelah masuk.

  Hak penggunaan dikelola bersama dengan status akun dan cara masuk. Menjaga informasi akun tetap terbaru membuat penilaian hak menjadi akurat. Meminjamkan atau menjual akun atau cara masuk kepada orang lain tidak diperbolehkan. Mencoba menggunakan fitur tanpa hak yang diperlukan dapat mengakibatkan pembatasan akses.

  Sebagian hak dibatasi lebih lanjut oleh usia, negara tempat tinggal, alat pembayaran, atau karakteristik produk. Hak yang dibatasi dapat diberikan kembali ketika kondisinya terpenuhi. Terpenuhi tidaknya kondisi dinilai berdasarkan kriteria yang diberitahukan di layar layanan. Kriteria keseluruhan pemberian dan pembatasan hak ditetapkan oleh ketentuan layanan dan panduan setiap produk.
