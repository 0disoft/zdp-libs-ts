short: "Lemon adalah unit kredit terpadu yang digunakan bersama di berbagai produk. Lemon terbagi menjadi Lemon berbayar yang diberikan saat pembelian dan Lemon gratis yang diberikan sebagai bonus. Lemon berbayar dapat menjadi objek pengembalian dana."
long: |-
  Lemon adalah unit kredit yang digunakan bersama di berbagai produk. Lemon terbagi menjadi Lemon berbayar yang diberikan melalui pembelian dan Lemon gratis yang diberikan melalui acara atau hadiah. Setiap Lemon mengikuti ketentuan masa berlaku dan pengembalian dana yang ditetapkan saat pemberian. Pada layar saldo, sumber dan tanggal kedaluwarsa setiap Lemon dapat diperiksa.

  Lemon dipotong sebagai unit yang diperlukan untuk menggunakan layanan. Pemotongan aktual hanya diterapkan pada cakupan tugas yang selesai. Jika tugas belum dimulai atau hasil yang sah tidak diterima karena kesalahan perusahaan, Lemon yang dipesan akan dipulihkan. Riwayat pemotongan dapat diperiksa dalam catatan pembayaran dan penggunaan.

  Lemon bonus dapat memiliki urutan penggunaan yang berbeda dari Lemon berbayar. Lemon bonus digunakan lebih dulu mulai dari yang masa berlakunya paling pendek. Lemon yang kedaluwarsa dihapus otomatis dan tidak dipulihkan. Secara keseluruhan, aturan pemberian, kedaluwarsa, dan pemulihan Lemon mengikuti kriteria yang ditetapkan dalam kebijakan kredit.
