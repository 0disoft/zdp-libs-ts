short: "マスキングは、個人情報の一部を隠して表示する処理方法です。 運営者は基本的にマスクされた情報だけを見ることができます。 原文を確認する必要がある場合にのみ、理由と範囲を記録してアクセスします。"
long: |-
  マスキングは、名前やアカウント情報などの個人情報の一部を記号などで隠して表示する方法です。 業務処理に必要な最小限の情報だけが見えるようにします。 個人情報を扱うシステムでは、マスキングが基本原則として適用されます。 運営者やサポート担当も基本的にマスクされた情報だけを見ます。

  ユーザーコンテンツの原文や外部アカウントトークンなど、隠すと業務ができない場合があります。 こうした例外状況には、理由、アクセス範囲、期限を記録します。 アクセス記録は監査ログとして残り、後から確認できます。 例外アクセスは必要最小限の担当者にだけ許可されます。

  マスキングはデータを削除するのではなく、表示方法を制限する処理です。 保存された原文情報は必要なセキュリティ基準を保って保管します。 利用者はいつでも自分の情報の処理状況を問い合わせられます。 マスキング基準はプライバシーポリシーに従って運用されます。
