short: "トークンは、外部アカウントの接続状態を示すアクセス証明です。 パスワードの代わりに、許可した範囲だけを確認できるようにします。 接続を解除すると、保存されたトークンは削除されます。"
long: |-
  トークンは、利用者が外部サービスとの接続を許可したときに発行されるアクセス証明です。 パスワードのように全体の権限を与えるのではなく、許可した範囲だけを使えるようにします。 外部サービスはこのトークンで利用者に代わって限られた作業を実行します。 トークン自体はパスワードではなく、必要になれば再発行できます。

  保存されたトークンは、接続した機能を実行するときだけ使います。 トークンを確認する必要がある状況には、理由とアクセス範囲を記録します。 利用者が接続を解除すると、すぐに新しいアクセス権限が停止されます。 解除後は、保存されたトークンとキャッシュデータを削除する手続きを進めます。

  プライバシーポリシーは、トークンの収集・保管・削除の基準を透明に公開します。 トークンは通常のデータと分離して安全に保管します。 セキュリティ事故や不審なアクセスが検出されれば、トークンを破棄して再発行できます。 利用者はいつでも接続リストで権限を確認し、撤回できます。
