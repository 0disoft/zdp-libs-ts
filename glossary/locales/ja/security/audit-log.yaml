short: "監査ログは、誰がいつどの情報にアクセスしたかを記録するセキュリティ記録です。 例外的なアクセスは理由、範囲、期限とともに記録されます。 セキュリティ事故が起きれば、この記録で原因を確認します。"
long: |-
  監査ログは、システムで行われた主要なアクセスと変更を時系列で残す記録です。 誰がどの情報にいつ、どの目的でアクセスしたかを確認できます。 通常の業務処理記録も含まれ、許可された範囲内でのみ行われます。 記録自体は改ざんや削除が難しいように保護されます。

  個人情報の原文や外部アカウントトークンにアクセスする例外状況は、必ず監査ログに残ります。 アクセス理由、範囲、期限が一緒に記録され、透明性を確保します。 セキュリティ事故や不正利用が疑われる場合、この記録で原因を追跡します。 記録の閲覧権限も別途制限されて運用されます。

  監査ログは個人情報を安全に扱うための基本的な仕組みです。 プライバシーポリシーは監査ログの運用基準を公開します。 利用者データを確認する作業は最小限に保たれ、常に記録されます。 不要になった記録は定められた保管期間に従って削除します。
