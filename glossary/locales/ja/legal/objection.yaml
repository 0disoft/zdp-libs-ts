short: "異議申立ては、利用制限などの根拠について争い、再検討を求める手続きです。 制限の理由が通知されたら、カスタマーサポートチャネルを通じて異議を申し立てられます。 申し立てられた理由と証拠を検討した結果に応じて、措置の維持または解除が決まります。"
long: |-
  異議申立ては、利用制限や決済措置などについて理由が不当であると争い、再判断を求める手続きです。 制限の理由と根拠が通知されると、定められた期間内に異議を申し立てられます。 申し立てられた異議は記録として残ります。 措置を維持するか解除するかは、検討の結果に応じて決まります。

  異議申立てを行っても、理由の確認と決済履歴の照会経路は引き続き維持されます。 緊急のセキュリティ・法的理由がない場合は、制限の前に理由を事前に知らせます。 異議申立ての過程では、本人確認と必要な証拠を求めることがあります。 請求の範囲は、法的・セキュリティ上許容される範囲内で決まります。

  異議が受け入れられると、制限は解除または緩和されることがあります。 受け入れられない場合は、既存の措置が維持されます。 結果は、サービス画面、通知またはメールで案内します。 全体的な手続きと処理期限は、利用規約、カスタマーサポートの案内と関連法令がともに定めます。
