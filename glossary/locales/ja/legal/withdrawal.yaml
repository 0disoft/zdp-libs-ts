short: "契約の撤回は、契約締結後、一定期間内に契約を撤回できる制度です。 サービスでは、有料レモンの付与条件が契約と異なる形で履行された場合にその根拠となります。 具体的な期間と手続きは、返金ポリシーで定められた基準に従います。"
long: |-
  契約の撤回は、消費者が契約を締結した後も一定期間内に契約をなかったことにできる権利です。 表示や広告、契約内容が実際に提供された内容と異なる場合の判断基準として使用されます。 法令と規約で定められた期間内に撤回を申請すれば、その効力が認められます。 撤回が認められると、その契約に応じた代金の返還が行われます。

  サービスでは、レモンの付与やサービスの提供が契約内容と異なる場合に、契約の撤回が問題になります。 重複決済や当社のエラーによる誤った付与も、修正の対象になります。 撤回事由が認められるかは、決済時点の契約と実際の履行内容を比較して判断します。 判断基準と必要な証拠は、返金ポリシーで具体的に案内します。

  契約の撤回が認められると、その決済で付与されたレモンと特典は回収の対象になります。 すでに使用したレモンがある場合は、使用分を除いて精算が行われます。 最終的な返金額と回収内容は、申請確定前にあらかじめ確認できます。 全体的な撤回手続きと処理期限は、関連法令と規約、返金ポリシーがともに定めます。
