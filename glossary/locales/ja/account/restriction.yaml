short: "利用制限は、規約違反やセキュリティ上のリスクなどによってサービスの利用を制限する措置です。 制限の範囲は、一部機能の制限からアカウント全体の制限までさまざまです。 緊急のセキュリティ・法的リスクは、即時の制限事由となり得ます。"
long: |-
  利用制限は、規約違反やセキュリティ・決済詐欺のリスクが確認された場合に、サービスの利用を制限する措置です。 違反の程度と範囲に応じて、一部の機能のみが制限されることがあります。 より深刻な場合は、アカウント全体が制限されることがあります。 制限の理由と範囲は、制限前または実施時点で案内します。

  緊急のセキュリティ・法的理由がない場合は、制限の理由を事前に知らせ、異議申立ての機会を提供します。 アカウントが制限されても、理由の確認と決済履歴の照会経路は維持されます。 異議申立ては、カスタマーサポートチャネルを通じて定められた期間内に行えます。 制限の解除が行われるかは、再検討の結果と決済状況に応じて決まります。

  アカウント制限は契約終了とは異なります。 一時的な制限は、条件が解消されれば再び解除されることがあります。 契約終了は、アカウントの閉鎖やサービスの終了につながります。 残りの購入レモンと有料の利用権限は、関係法令とポリシーに従って精算・返金され、案内なしに一括で失効させることはありません。
