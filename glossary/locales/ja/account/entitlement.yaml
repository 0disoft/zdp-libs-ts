short: "利用権限は、アカウントが特定の製品や有料機能を利用できる権限です。 アカウントを作成しただけでは、すべての権限が自動的に付与されるわけではありません。 実際の権限は、年齢や居住国、決済手段、製品条件に応じて異なります。"
long: |-
  利用権限は、1つのアカウントが複数の製品にログインした後も、各サービスごとに異なる形で適用される利用権限です。 アカウントを作成したという事実だけでは、すべての製品や有料機能への権限が生じるわけではありません。 実際の権限は、製品ごとのポリシーと提供状況に応じて決まります。 権限の有無は、ログイン後、各製品の画面で確認できます。

  利用権限は、アカウントの状態とログイン手段に応じてともに管理されます。 アカウント情報を最新に保つことで、権限の判断が正確に行われます。 アカウントやログイン手段を他人に貸したり販売したりする行為は許可されません。 権限がない状態で機能を試すと、アクセスが制限されることがあります。

  一部の権限は、年齢や居住国、決済手段、製品特性に応じて追加で制限されます。 制限された権限は、条件を満たせば再度付与されることがあります。 条件を満たすかは、サービス画面で案内された基準で判断します。 全体的な権限の付与・制限の基準は、利用規約と各製品の案内で定めます。
