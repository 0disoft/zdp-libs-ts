short: "休眠状態とは、一定期間ログインやサービス利用がないアカウントの状態です。 休眠状態という理由だけで購入したレモンが削除されることはありません。 アカウントを再び利用すると、購入レモンの権利はそのまま維持されます。"
long: |-
  休眠状態とは、アカウントが一定期間ログインせずサービスを利用しないまま待機状態になったことを指します。 休眠状態になっても、アカウント情報と購入レモンはそのまま保管されます。 購入レモンの有効期間は休眠の有無に関係なく同じように適用されます。 再ログインすると休眠状態は解除されます。

  休眠状態はアカウント閉鎖やサービス終了とは異なります。 アカウント閉鎖やサービス終了時には、残ったレモンの返金と移管手続きを事前に案内します。 休眠状態では、案内なしに購入レモンを削除しません。 休眠判定の期間は製品ごとの案内で確認できます。

  休眠状態が長く続いても、購入レモンの所有権は維持されます。 休眠中に失効するのは有効期間が設定されたレモンだけです。 失効の有無や日程は残高画面で確認できます。 不明な点はカスタマーサポート窓口で問い合わせできます。
