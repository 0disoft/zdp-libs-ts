short: "レモンは、複数の製品で共通に使用する統合クレジットの単位です。 購入時に付与される有料レモンと、ボーナスとして付与される無料レモンに区分されます。 有料レモンは返金の対象となることがあります。"
long: |-
  レモンは、複数の製品で共通に使用するクレジットの単位です。 購入を通じて付与される有料レモンと、イベントや報酬として付与される無料レモンに分かれます。 各レモンの有効期間と返金の可否は、付与時点で定められた条件に従います。 残高画面では、レモンの出所と有効期限を確認できます。

  レモンは、サービス利用時に必要な単位として差し引かれます。 実際の差引は、作業が完了した範囲のみ行われます。 作業が開始されていない場合や、当社の責めに帰すべき事由により有効な結果を受け取れなかった場合は、予約されたレモンが復元されます。 差引履歴は、決済および利用記録で確認できます。

  ボーナスレモンは、有料レモンと使用順序が異なる場合があります。 ボーナスレモンは、有効期間が短いものから先に使用されます。 有効期間が過ぎたレモンは自動的に失効し、復元されません。 全体として、レモンの付与・失効・復元のルールは、クレジットポリシーで定められた基準に従います。
