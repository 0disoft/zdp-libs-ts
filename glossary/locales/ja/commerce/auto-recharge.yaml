short: "自動チャージは、レモン残高が基準以下になったときに設定金額を自動でチャージする機能です。 利用者はいつでも自動チャージを解約できます。 解約後は追加チャージが発生しません。"
long: |-
  自動チャージは、利用者が手動でチャージしなくても残高を維持できるようにする機能です。 残高が設定した基準より低くなると、設定した金額で自動チャージが行われます。 チャージ履歴と金額は決済記録で確認できます。 自動チャージを利用するかどうかは利用者自身が選択します。

  自動チャージはいつでも解約でき、解約時点以降の追加チャージだけが停止されます。 解約前にすでに完了した決済は既存の返金基準に従います。 自動チャージで支払った金額も通常の決済と同じように返金対象になり得ます。 解約後は必要な分だけ手動でチャージできます。

  自動チャージ設定画面で基準残高とチャージ金額を決められます。 設定変更と解約履歴はサービス画面で確認できます。 自動チャージによるエラーはカスタマーサポート窓口で訂正できます。 全体の基準はクレジットポリシーと返金ポリシーが定めます。
