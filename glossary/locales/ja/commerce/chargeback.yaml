short: "チャージバックは、支払いの紛争が起きたときに決済代行業者を通じて代金が戻される手続きです。 重複やエラー以外の理由で代金が回収されると、関連する特典も整理されます。 問題が解決するまで、その決済と有料機能の利用が制限されることがあります。"
long: |-
  チャージバックは、カード会社や決済代行業者が紛争を理由に支払い代金を回収する手続きです。 支払い者が承認していない決済だと主張したり、サービス紛争が起きた場合に開始されることがあります。 会社はチャージバックの理由を確認し、必要な証拠を提出して対応します。 チャージバックの結果は決済状態と取引履歴に反映されます。

  チャージバックで代金が回収されると、その決済で付与された購入レモンとボーナスレモンは回収の対象になります。 すでに一部のレモンを使用している場合は、使用分だけ精算が行われます。 問題が解決するまで、決済および該当の有料機能の利用が制限されることがあります。 制限理由と進行状況は利用者に明確に案内します。

  チャージバックは通常の返金とは手続きが異なります。 返金はサービス側が先に処理しますが、チャージバックは決済代行業者が介入します。 異議が受け入れられなければ代金は維持され、差引履歴もそのまま残ります。 詳細な基準は返金ポリシーとクレジットポリシーで確認できます。
