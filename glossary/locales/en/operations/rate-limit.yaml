short: "Rate Limit is a technique that restricts the number of requests a client can send within a specific time window. Its main purposes are preventing abuse, maintaining stability, and mitigating attacks. It uses HTTP 429 responses and algorithms such as token bucket and sliding window."
long: |-
  Rate Limit is a technique that limits the number of requests a server accepts during a given period of time. Clients cannot send more requests than the defined count. This restriction protects server resources. Excess requests may be rejected or delayed.

  The main purpose is to prevent request abuse. It maintains stability by reducing server overload. It mitigates the impact of intentional attacks. This also protects the experience of normal users.

  The limit state can be communicated through an HTTP 429 response. Token bucket algorithms are commonly used for implementation. Sliding window algorithms are also widely used. The two can be combined for more precise control depending on the situation.
