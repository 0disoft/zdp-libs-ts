short: "柠檬是多个产品共同使用的统一积分单位。分为购买时发放的付费柠檬和作为奖励发放的免费柠檬。付费柠檬可能成为退款对象。"
long: |-
  柠檬是多个产品共同使用的积分单位。 分为通过购买发放的付费柠檬和通过活动或奖励发放的免费柠檬。 每个柠檬的有效期和退款可能性遵循发放时确定的条件。 在余额页面可以查看柠檬的来源和到期日。

  柠檬是使用服务时所需的扣除单位。 实际扣除仅针对已完成的任务范围。 如果任务尚未开始，或因公司责任未能获得有效结果，预留的柠檬将被恢复。 扣除记录可以在支付和使用记录中查看。

  奖励柠檬可能与付费柠檬的使用顺序不同。 奖励柠檬从有效期较短的部分开始使用。 超过有效期的柠檬会自动失效且不会恢复。 整体上，柠檬的发放、过期和恢复规则遵循积分政策确定的标准。
