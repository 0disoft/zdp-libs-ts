short: "使用权限是账户使用特定产品或付费功能的权限。仅创建账户不会自动获得所有权限。实际权限因年龄、居住国家、支付方式和产品条件而异。"
long: |-
  使用权限是一个账户登录多个产品后，也按各服务不同适用的使用权限。 仅创建账户这一事实不会带来所有产品或付费功能的权限。 实际权限根据各产品的政策与提供状态确定。 是否拥有权限可在登录后各产品页面查看。

  使用权限与账户状态和登录方式一同管理。 保持账户信息最新才能准确判断权限。 不得将账户或登录方式出借或出售给他人。 在无权限状态下尝试功能时，访问可能会受到限制。

  部分权限会因年龄、居住国家、支付方式或产品特性而受到额外限制。 受限权限在满足条件后可以重新授予。 是否满足条件以服务页面告知的标准判断。 整体权限的授予与限制标准由服务条款和各产品指南规定。
