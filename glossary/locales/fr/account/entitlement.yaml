short: "Le droit d'utilisation est l'autorisation d'un compte à utiliser un produit spécifique ou une fonction payante. La simple création d'un compte n'accorde pas automatiquement tous les droits. Les droits réels varient selon l'âge, le pays de résidence, le moyen de paiement et les conditions du produit."
long: |-
  Le droit d'utilisation est une autorisation qui s'applique différemment à chaque service, même lorsqu'un compte se connecte à plusieurs produits. Le simple fait de créer un compte ne crée pas de droits sur tous les produits ou fonctions payantes. Les droits réels sont déterminés selon la politique et la disponibilité de chaque produit. La présence d'un droit peut être vérifiée sur l'écran de chaque produit après connexion.

  Le droit d'utilisation est géré conjointement avec l'état du compte et le mode de connexion. Maintenir les informations du compte à jour permet de juger les droits avec précision. Le prêt ou la vente du compte ou du mode de connexion à des tiers n'est pas autorisé. Tenter d'utiliser une fonction sans le droit requis peut entraîner une restriction d'accès.

  Certains droits sont en outre limités par l'âge, le pays de résidence, le moyen de paiement ou les caractéristiques du produit. Un droit restreint peut être à nouveau accordé lorsque les conditions sont remplies. Le respect des conditions est jugé selon les critères indiqués à l'écran du service. Les critères généraux d'octroi et de restriction des droits sont définis par les conditions d'utilisation et le guide de chaque produit.
