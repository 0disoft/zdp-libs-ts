short: "Vault est un système qui chiffre et gère les secrets. Il inclut des fonctions comme les journaux d'accès, l'expiration, les journaux d'audit et la génération dynamique de secrets. Il protège de manière sécurisée les clés d'API, les mots de passe de base de données, les certificats et les jetons."
long: |-
  Vault est un système qui stocke et gère les secrets de manière sécurisée. Les secrets désignent des valeurs comme les clés d'API, les mots de passe de base de données, les certificats et les jetons. Le chiffrement est appliqué lors du stockage pour éviter les fuites externes. Un historique indique qui a accédé à quoi et à quel moment.

  Les permissions d'accès peuvent être contrôlées avec précision. Certains secrets expirent automatiquement après une durée déterminée. La fonction d'expiration aide à réduire l'impact d'un secret exposé. L'historique des accès peut être retracé grâce aux journaux d'audit.

  Les secrets peuvent également être générés dynamiquement. Cette approche crée des secrets temporaires à courte durée de vie. Les secrets temporaires présentent un risque de fuite à long terme plus faible. Globalement, cela améliore la stabilité et la flexibilité de la gestion des secrets.
