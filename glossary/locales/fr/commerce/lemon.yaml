short: "Lemon est l'unité de crédit intégrée utilisée en commun par plusieurs produits. Elle se divise en Lemons payants, attribués à l'achat, et en Lemons gratuits, attribués en bonus. Les Lemons payants peuvent être éligibles au remboursement."
long: |-
  Lemon est l'unité de crédit utilisée en commun par plusieurs produits. Elle se divise en Lemons payants attribués par l'achat et en Lemons gratuits attribués par des événements ou des récompenses. Chaque Lemon suit les conditions de validité et de remboursabilité définies au moment de l'attribution. L'écran de solde permet de consulter l'origine et la date d'expiration de chaque Lemon.

  Les Lemons sont déduits comme unité nécessaire à l'utilisation du service. La déduction réelle ne s'applique qu'à la partie achevée de la tâche. Si la tâche n'a pas commencé ou si aucun résultat valable n'a été reçu du fait de l'entreprise, les Lemons réservés sont restaurés. L'historique des déductions peut être consulté dans les enregistrements de paiement et d'utilisation.

  Les Lemons de bonus peuvent suivre un ordre d'utilisation différent des Lemons payants. Les Lemons de bonus sont consommés en premier à partir de l'expiration la plus proche. Les Lemons expirés sont supprimés automatiquement et ne sont pas restaurés. Globalement, les règles d'émission, d'expiration et de restauration des Lemons suivent les critères définis dans la politique de crédits.
