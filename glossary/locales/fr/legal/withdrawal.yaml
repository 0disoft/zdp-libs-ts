short: "La rétractation est un dispositif permettant de retirer le contrat dans un délai déterminé après sa conclusion. Dans le service, elle sert de fondement lorsque les conditions d'attribution des Lemons payants sont exécutées différemment du contrat. Le délai et la procédure concrets suivent les critères définis dans la politique de remboursement."
long: |-
  La rétractation est le droit du consommateur de rendre le contrat sans effet dans un délai déterminé après sa conclusion. Elle est utilisée comme critère de jugement lorsque l'affichage, la publicité ou le contenu du contrat diffèrent de ce qui a réellement été fourni. Si la demande est présentée dans le délai fixé par la loi et les conditions, son effet est reconnu. Lorsque la rétractation est reconnue, le montant de ce contrat est restitué.

  Dans le service, la rétractation se pose lorsque l'attribution de Lemons ou la fourniture du service diffèrent du contenu du contrat. Les paiements en double ou les attributions incorrectes dues à une erreur de l'entreprise font également l'objet d'une correction. La reconnaissance du motif de rétractation est jugée en comparant le contrat du moment du paiement avec l'exécution réelle. Les critères de jugement et les justificatifs requis sont précisés dans la politique de remboursement.

  Lorsque la rétractation est reconnue, les Lemons et avantages attribués par ce paiement font l'objet d'une reprise. Si des Lemons ont déjà été utilisés, la part utilisée est exclue du solde. Le montant final du remboursement et le détail de la reprise peuvent être consultés avant la confirmation de la demande. La procédure globale de rétractation et les délais de traitement sont fixés conjointement par la législation applicable, les conditions et la politique de remboursement.
