glossary_contract:
  status: skeleton
  term_id_pattern: namespace.concept
  copy_contract:
    current_version: 2
    legacy_default_version: 1
    human_review_required: true
    copy_provenance:
      required_from_version: 2
      allowed_origins:
        - human
        - llm
      llm_initial_human_review_status: pending
      human_review_complete_status: reviewed
      unreviewed_llm_severity: warning
    short:
      paragraphs: 1
      sentences_per_paragraph: 3
    long:
      paragraphs: 3
      sentences_per_paragraph: 4
    locale_style:
      ko: plain-declarative-da
  required_metadata:
    - id
    - canonical_label
    - status
    - visibility
    - aliases
    - match_phrases
    - locales
    - owner
    - interaction
  required_locale_metadata:
    - label
    - slug
    - short
    - translation_status
  current_locale_metadata:
    - copy_contract_version
    - copy_provenance
  forbidden_ownership:
    - glossary_backend_cms
    - advertising_runtime
    - product_domain_copy_final_approval
    - morphology_engine
    - provider_ad_sdk
  forbidden_values:
    - private_internal_terms_in_public_manifest
    - secret_values
    - internal_urls
    - raw_customer_payload
    - hover_trigger_for_public_terms
    - hover_card_ads
