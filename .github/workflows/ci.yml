name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: standalone check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: projects/zdp-platforms/contracts/zdp-libs-ts

    steps:
      - name: Checkout libs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          path: projects/zdp-platforms/contracts/zdp-libs-ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install libs dependencies
        run: bun install --frozen-lockfile

      - name: Check standalone repository
        run: bun run check

  api-contract-integration:
    name: API contracts integration
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: projects/zdp-platforms/contracts/zdp-libs-ts

    steps:
      - name: Checkout libs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          path: projects/zdp-platforms/contracts/zdp-libs-ts

      - name: Checkout API contracts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          repository: 0disoft/zdp-api-contracts
          path: projects/zdp-platforms/contracts/zdp-api-contracts

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install libs dependencies
        run: bun install --frozen-lockfile

      - name: Check API contract integration
        run: bun run check:integration
