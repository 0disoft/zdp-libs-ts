name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: projects/zdp-platforms/contracts/zdp-libs-ts

    steps:
      - name: Checkout libs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          path: projects/zdp-platforms/contracts/zdp-libs-ts

      - name: Checkout API contracts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          repository: 0disoft/zdp-api-contracts
          path: projects/zdp-platforms/contracts/zdp-api-contracts

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

  package:
    name: package / Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    defaults:
      run:
        working-directory: projects/zdp-platforms/contracts/zdp-libs-ts

    steps:
      - name: Checkout libs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          path: projects/zdp-platforms/contracts/zdp-libs-ts

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Verify generated package output is committed
        run: |
          changes="$(git status --porcelain --untracked-files=all -- dist)"
          if [ -n "$changes" ]; then
            echo "::error::Committed dist does not match the package build."
            printf '%s\n' "$changes"
            exit 1
          fi

      - name: Verify tarball contents and budgets
        if: matrix.node == '24'
        run: bun scripts/check-packed-package.ts

      - name: Verify packed package consumer
        run: bun scripts/smoke-packed-package.ts
